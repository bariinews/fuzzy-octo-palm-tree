<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barii News</title>
<meta name="description" content="Barii News — Trusted news on health, science and technology, society, politics, economy, culture, education, sports and the world. Read in English, Afaan Oromoo, Amharic and more.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Barii News">
<meta property="og:description" content="True News, A New Dawn">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%230a0a0a'/%3E%3Ccircle cx='32' cy='35' r='13' fill='%23d7141a'/%3E%3Cpath d='M4 35h56v12H4z' fill='%230a0a0a'/%3E%3Ccircle cx='32' cy='36' r='4' fill='%23fff'/%3E%3Cpath d='M25 50c0-7 3-10 7-10s7 3 7 10z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ================= BARII NEWS — ⚫ 🔴 ⚪ ================= */
:root{--k:#0a0a0a;--r:#d7141a;--bg:#fff;--bg2:#f4f4f4;--tx:#111;--mut:#676767;--ln:#e6e6e6;
--serif:Georgia,"Times New Roman","Noto Serif","Noto Serif Ethiopic",Nyala,serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic",Nyala,Arial,sans-serif;
--max:1240px;--rad:6px}
[data-theme=dark]{--bg:#0b0b0b;--bg2:#161616;--tx:#f1f1f1;--mut:#a3a3a3;--ln:#252525}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;top:0!important;position:static!important}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{max-width:100%;display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--r);outline-offset:2px}

/* Google Translate UI dhoksuu */
#gt,.goog-te-banner-frame,.skiptranslate>iframe,iframe.skiptranslate,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
font{background:transparent!important;box-shadow:none!important}

/* -------- Mata (Header) -------- */
.hd{position:sticky;top:0;z-index:40;background:var(--k);color:#fff}
.hd-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;height:60px}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:50%;cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:22px;height:22px}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
[dir=rtl] .logo{margin-right:0;margin-left:auto}
.logo svg{width:40px;height:40px;flex:none}
.wm{font:900 21px/1 var(--sans);letter-spacing:1.5px;white-space:nowrap}
.wm b{color:var(--r);font-weight:900}
.lb{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:transparent;color:#fff;font:700 12.5px var(--sans);cursor:pointer;text-transform:uppercase;flex:none}
.lb svg{width:16px;height:16px}
.lb:hover{border-color:#fff}
.sbar{display:none;background:var(--k);padding:0 12px 12px}
.sbar.on{display:block}
.sbar input{display:block;max-width:760px;margin:0 auto;width:100%;height:46px;border-radius:999px;border:0;padding:0 20px;font:16px var(--sans);background:#fff;color:#111}
.nav{background:var(--bg);border-bottom:1px solid var(--ln);position:sticky;top:60px;z-index:39}
.nav-in{max-width:var(--max);margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:12px 12px 10px;font:700 13.5px var(--sans);border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--r)}
.nav a.on{border-color:var(--r);color:var(--r)}
@media(min-width:1024px){.hd-in{height:74px;padding:0 16px}.nav{top:74px}.logo svg{width:50px;height:50px}.wm{font-size:28px}.nav-in{justify-content:center}}

.tick{background:var(--r);color:#fff;font:600 14px var(--sans)}
.tick-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 12px;height:38px}
.tick-l{background:var(--k);padding:3px 10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;flex:none}
.tick-t{overflow:hidden;white-space:nowrap;flex:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tick-t span{display:inline-block;padding-left:100%;animation:tk 55s linear infinite}
.tick-t a{margin-right:52px}
.tick-t a::before{content:"";display:inline-block;width:6px;height:6px;background:#fff;margin-right:9px;vertical-align:2px}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tick-t span{animation:none;padding-left:0}}
.off{display:none;background:#222;color:#fff;text-align:center;font:13px var(--sans);padding:6px}

/* -------- Qabiyyee -------- */
main{max-width:var(--max);margin:0 auto;padding:18px 14px 40px;min-height:62vh}
.dl{font:700 11.5px var(--sans);text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);margin:0 0 14px}
.top{display:grid;gap:24px}
@media(min-width:900px){.top{grid-template-columns:1.8fr 1fr;gap:30px}}
.lead{position:relative;display:block;border-radius:var(--rad);overflow:hidden;background:var(--k);color:#fff;min-height:380px}
@media(min-width:900px){.lead{min-height:500px}}
.lead .cv{position:absolute;inset:0;aspect-ratio:auto;height:100%;border-radius:0}
.lead .cv{align-items:start;padding-top:9%}
.lead .cv svg{width:22%;max-width:110px}
.lead-t{position:absolute;left:0;right:0;bottom:0;padding:90px 20px 22px;background:linear-gradient(transparent,rgba(0,0,0,.94) 62%)}
.lead h2{font:700 clamp(25px,3.5vw,40px)/1.13 var(--serif);margin:10px 0 8px;letter-spacing:-.3px}
.lead p{color:#d6d6d6;margin:0 0 10px;font-size:15.5px;max-width:640px}
.lead .mt{color:#aaa}
.lead:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.kick{display:inline-block;background:var(--r);color:#fff;font:800 10.5px var(--sans);letter-spacing:1.4px;text-transform:uppercase;padding:4px 8px}
.nl{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--ln)}
.nl:last-child{border:0}
.num{font:700 30px/1 var(--serif);color:var(--r)}
.nl h3{font:700 17px/1.3 var(--serif);margin:3px 0 4px}
.nl:hover h3{color:var(--r)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:44px 0 16px;padding-top:10px;border-top:3px solid var(--tx)}
.sh.s0{margin-top:0}
.sh h2{font:800 14px var(--sans);text-transform:uppercase;letter-spacing:1.6px;display:flex;align-items:center;gap:10px;margin:0}
.sh h2::before{content:"";width:11px;height:11px;background:var(--r);flex:none}
.sh a{font:700 12.5px var(--sans);color:var(--r);white-space:nowrap}
.grid{display:grid;gap:26px 22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:flex;flex-direction:column;gap:10px}
.card .cv{border-radius:var(--rad)}
.cb{display:flex;flex-direction:column;gap:5px;min-width:0}
.card h3{font:700 19px/1.28 var(--serif);margin:0}
.card:hover h3{color:var(--r)}
.card p{color:var(--mut);font-size:14.5px;margin:0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tg{font:800 10.5px var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--r)}
.mt{font:12.5px var(--sans);color:var(--mut)}
@media(max-width:640px){
 .grid{grid-template-columns:1fr;gap:0}
 .card{flex-direction:row-reverse;gap:12px;padding:15px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
 .card .cv{width:104px;flex:none;aspect-ratio:1}
 .card .cv svg{width:44%}
 .card h3{font-size:17px}
 .card p{display:none}
 .cb{flex:1}
}
.cv{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--k);display:grid;place-items:center;color:#fff}
.cv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,70%) var(--y,30%),rgba(215,20,26,.92),rgba(215,20,26,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 1px,transparent 1px 12px)}
.cv svg{position:relative;width:30%;max-width:120px;height:auto;aspect-ratio:1;stroke-width:1.15}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more{display:flex;margin:28px auto 0;height:44px;padding:0 26px;align-items:center;border:2px solid var(--tx);background:transparent;color:var(--tx);font:800 12.5px var(--sans);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.more:hover{background:var(--tx);color:var(--bg)}
.ph{display:flex;align-items:center;gap:14px;margin:6px 0 24px;padding-bottom:18px;border-bottom:3px solid var(--tx)}
.ph .pi{width:56px;height:56px;background:var(--r);color:#fff;display:grid;place-items:center;flex:none}
.ph .pi svg{width:30px;height:30px}
.ph h1{font:700 clamp(26px,4vw,40px)/1.1 var(--serif);margin:0}
.ph p{margin:4px 0 0;color:var(--mut);font-size:14px}
.empty{text-align:center;padding:70px 14px;color:var(--mut)}
.empty svg{width:64px;height:64px;color:var(--r);margin-bottom:10px}
.empty h2{font:700 24px var(--serif);color:var(--tx);margin:0 0 6px}

/* -------- Miilla (Footer) -------- */
footer{background:var(--k);color:#a9a9a9;margin-top:30px}
.ft{max-width:var(--max);margin:0 auto;padding:28px 14px 20px}
.ft-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid #222}
.ft-brand{display:flex;align-items:center;gap:10px;color:#fff}
.ft-brand svg{width:40px;height:40px}
.ft-brand small{display:block;color:#999;font-size:12px;margin-top:2px}
.soc{display:flex;gap:8px}
.soc a{width:34px;height:34px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px var(--sans)}
.soc a:hover{background:var(--r);border-color:var(--r)}
.ft-cats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:16px 0;border-bottom:1px solid #222;font:700 13px var(--sans)}
.ft-cats a{color:#e6e6e6}
.ft-cats a:hover{color:var(--r)}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;font-size:12px}
.ft-links{display:flex;flex-wrap:wrap;gap:4px 16px}
.ft-links button{background:none;border:0;color:#a9a9a9;font:12px var(--sans);cursor:pointer;padding:2px 0}
.ft-links button:hover{color:#fff}

/* -------- Menu (Drawer) -------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--k);color:#fff;z-index:71;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.drw.on{transform:none}
.drw-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 16px;border-bottom:1px solid #222;min-height:60px}
.drw-h .wm{font-size:19px}
.drw-q{padding:14px 16px 6px}
.drw-q input{width:100%;height:42px;border-radius:999px;border:1px solid #333;background:#151515;color:#fff;padding:0 16px;font:15px var(--sans)}
.drw nav{padding:6px 0}
.drw nav a{display:flex;align-items:center;gap:14px;padding:12px 18px;font:600 15px var(--sans);border-left:3px solid transparent}
.drw nav a:hover{background:#141414}
.drw nav a.on{border-color:var(--r);background:#151515;color:#fff}
.drw nav svg{width:20px;height:20px;opacity:.85}
.drw-s{padding:16px;border-top:1px solid #222}
.drw-s h6{font:800 10.5px var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:#8a8a8a;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 13px;border-radius:999px;border:1px solid #333;background:transparent;color:#fff;font:600 13px var(--sans);cursor:pointer}
.chips button.on{background:var(--r);border-color:var(--r)}
.drw-small{display:flex;flex-wrap:wrap;gap:6px 16px}
.drw-small button{background:none;border:0;color:#9a9a9a;font:13px var(--sans);cursor:pointer;padding:2px 0}
.drw-small button:hover{color:#fff}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#fff;font:600 14px var(--sans);cursor:pointer;padding:0}
.tgl i{width:42px;height:24px;border-radius:999px;background:#333;position:relative;transition:.2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
[data-theme=dark] .tgl i{background:var(--r)}
[data-theme=dark] .tgl i::after{left:21px}

/* -------- Modal xiqqaa (Waa'ee Keenya, Nu Qunnamaa, Afaan) -------- */
.mdl{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.mdl.on{display:flex}
.mdl-b{position:relative;background:var(--bg);color:var(--tx);width:100%;max-width:600px;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease;border-top:4px solid var(--r)}
@media(min-width:700px){.mdl{align-items:center}.mdl-b{border-radius:10px}}
.mdl-x{position:absolute;top:8px;right:8px;color:var(--tx)}
[dir=rtl] .mdl-x{right:auto;left:8px}
.mdl-x:hover{background:var(--bg2)}
.mdl h2{font:700 25px/1.2 var(--serif);margin:0 40px 4px 0}
.mdl .sub{color:var(--mut);margin:0 0 6px;font-size:14px}
.mdl h3{font:800 11.5px var(--sans);text-transform:uppercase;letter-spacing:1.4px;color:var(--r);margin:22px 0 6px}
.mdl p,.mdl li{font-size:15px;line-height:1.65;margin:0 0 8px}
.mdl ul{padding-left:18px;margin:0}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals span{border:1px solid var(--ln);padding:5px 11px;border-radius:999px;font:600 13px var(--sans)}
.clist a,.clist div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-weight:600}
.clist i{width:36px;height:36px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px;flex:none}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.langs button{padding:11px 13px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;font:600 14px var(--sans);text-align:start;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.langs button:hover{border-color:var(--tx)}
.langs button.on{border-color:var(--r);background:var(--r);color:#fff}
.langs small{font-size:10px;opacity:.7;text-transform:uppercase}
.acc{margin-top:14px;border-top:1px solid var(--ln)}
.acc details{border-bottom:1px solid var(--ln)}
.acc summary{list-style:none;cursor:pointer;padding:14px 30px 14px 0;font:700 16px var(--serif);position:relative}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";position:absolute;right:4px;top:10px;font:400 24px var(--sans);color:var(--r)}
.acc details[open] summary::after{content:"\2212"}
.acc details>div{padding:0 0 12px}
.aclose{text-align:center;font:700 17px var(--serif);margin:22px 0 12px!important}
.mlogo{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.mlogo svg{width:64px;height:64px;flex:none}

/* -------- Dubbisaa (Reader) — oduu qofa -------- */
.rd{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none}
.rd.on{display:block;animation:up .28s ease}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.rd-p{position:fixed;top:0;left:0;height:3px;background:var(--r);width:0;z-index:93}
.rd-x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:93;width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,10,10,.85);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
[dir=rtl] .rd-x{right:auto;left:12px}
.rd-x svg{width:22px;height:22px}
.rd-in{max-width:720px;margin:0 auto;padding:66px 20px 150px;font-size:var(--fs,19px)}
.rd h1{font:700 clamp(28px,5.6vw,46px)/1.13 var(--serif);margin:14px 0 14px;letter-spacing:-.4px}
.rd .rs{font:400 1.07em/1.55 var(--serif);color:var(--mut);margin:0 0 18px}
.rd .rm{font:13px var(--sans);color:var(--mut);padding:12px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:4px 16px}
.rd .rm b{color:var(--tx)}
.rd .cv{margin:24px 0;border-radius:var(--rad)}
.rb{font-family:var(--serif);line-height:1.8}
.rb p{margin:0 0 1.15em}
.rb h2{font:700 1.25em/1.3 var(--serif);margin:1.6em 0 .5em}
.rb blockquote{margin:1.6em 0;padding:2px 0 2px 20px;border-left:4px solid var(--r);font-size:1.14em;font-style:italic}
.rb>p:first-of-type::first-letter{float:left;font-size:3.5em;line-height:.82;padding:.06em .1em 0 0;color:var(--r);font-weight:700}
.ai{background:var(--bg2);border-left:4px solid var(--r);padding:14px 16px;margin:22px 0;border-radius:0 8px 8px 0;font:15.5px/1.6 var(--sans)}
.ai b{display:flex;gap:6px;align-items:center;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--r);margin-bottom:8px}
.ai b svg{width:16px;height:16px}
.ai ul{margin:0;padding-left:18px}
.ai li{margin:0 0 6px}
.ai small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.rend{margin-top:40px;padding-top:18px;border-top:3px solid var(--tx);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 13px var(--sans)}
.rend>span{margin-right:4px;text-transform:uppercase;letter-spacing:1px;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:700 13px var(--sans);cursor:pointer}
.pill:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:93;display:flex;gap:2px;background:rgba(10,10,10,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .25s,opacity .25s}
.dock.hide{transform:translate(-50%,110px);opacity:0}
.dock button{display:flex;align-items:center;gap:7px;height:42px;padding:0 15px;border:0;border-radius:999px;background:transparent;color:#fff;font:700 13px var(--sans);cursor:pointer;white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.12)}
.dock button.on{background:var(--r)}
.dock svg{width:18px;height:18px}
@media(max-width:480px){.dock button span{display:none}.dock button{padding:0 15px}}

/* -------- Miidiyaa: viidiyoo, suuraalee, sagalee -------- */
.vbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--rad);overflow:hidden;margin:24px 0}
.vbox.tall{aspect-ratio:9/16;max-width:360px;margin-left:auto;margin-right:auto}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vplay{position:absolute;inset:0;width:100%;border:0;padding:0;cursor:pointer;background:#111 center/cover no-repeat;display:grid;place-items:center}
.vplay::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}

  "id": "lassa-fever-has-killed-278-people-in-nigeria-this-year-as-de",
  "kind": "oduu",
  "cat": "fayyaa",
  "title": "Lassa Fever Has Killed 278 People in Nigeria This Year as Death Rate Climbs",
  "summary": "Nigeria has confirmed 1,226 Lassa fever cases across 26 states in 2026. Health officials warn the fatality rate is higher than last year.",
  "body": "Nigeria has recorded 278 deaths from Lassa fever so far in 2026, with 1,226 confirmed cases, according to the latest figures from the Nigeria Centre for Disease Control and Prevention (NCDC). The disease has now been confirmed in 26 of the country's 36 states and in 122 local government areas.\n\n## A deadly year\n\nThe cumulative case fatality rate (CFR) — the share of confirmed patients who died — stands at 22.7 percent. That means nearly one in four people confirmed with the disease this year has died.\n\nThe figures are worse than last year. By the same point in 2025 (weeks 1 to 46), Nigeria had recorded 995 confirmed cases and 178 deaths, with a fatality rate of 17.9 percent, according to NCDC's weekly epidemiological report. This year there have been about 100 more deaths.\n\n## The latest weeks\n\nIn epidemiological week 45, NCDC recorded 141 suspected cases and 18 confirmed infections, with no new confirmed deaths. In week 46, there were 151 suspected cases and 22 confirmed infections, again with no new confirmed deaths.\n\nEarlier, in week 44, confirmed infections rose from 9 to 13 and four more deaths were recorded. Earlier in the year, NCDC said most confirmed cases came from five states: Bauchi, Ondo, Taraba, Benue and Edo.\n\n## What is Lassa fever?\n\nLassa fever is a viral haemorrhagic illness that is endemic in parts of West Africa. People are mainly infected through contact with food or household items contaminated by the urine or droppings of infected rats. It can also spread from person to person through blood and other body fluids, especially in health facilities without proper infection control.\n\nMany infections are mild, but severe cases can cause bleeding, breathing problems, shock and organ failure. There is currently no approved vaccine. Early treatment greatly improves the chance of survival, while late arrival at hospital is one of the main reasons for deaths.\n\n## Warning signs\n\nNCDC urges anyone with fever, weakness, headache or unusual bleeding to seek medical care immediately — especially in areas where Lassa fever cases have been reported. The agency says detection of new cases calls for continued vigilance, early diagnosis and prompt treatment.\n\n## How to protect yourself\n\n- Keep your home and surroundings clean and free of rats and clutter.\n- Store food in tightly covered containers.\n- Dispose of rubbish properly and away from the house.\n- Do not dry food on open ground where rats can reach it.\n- Health workers should use gloves and other protective equipment when caring for patients.\n\n> \"Everyone has a role to play in preventing Lassa fever.\" — NCDC\n\n## Why it matters for the region\n\nLassa fever cases usually rise during the dry season, from about December to April. With the season approaching, health officials say communities and hospitals must prepare now.\n\nBarii News will continue to follow public health news across Africa.\n\nSources: Nigeria Centre for Disease Control and Prevention (NCDC); The News Chronicle; Premium Times; Arise News.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-26",
  "image": "barii-lassa-2026.jpg"
 },
 {
  "id": "sudan-s-government-rejects-abiy-s-offer-to-host-peace-talks",
  "kind": "oduu",
  "cat": "addunyaa",
  "title": "Sudan's Government Rejects Abiy's Offer to Host Peace Talks, While RSF Side Welcomes It",
  "summary": "Ethiopia's prime minister invited all Sudanese parties to talks in Addis Ababa to end a war now in its fourth year. Khartoum said no, accusing Ethiopia of lacking neutrality.",
  "body": "Sudan's army-aligned government has rejected an offer by Ethiopian Prime Minister Abiy Ahmed to host peace talks aimed at ending the country's devastating war. A rival administration aligned with the paramilitary Rapid Support Forces (RSF) has welcomed the initiative, exposing deep divisions over Ethiopia's role in efforts to bring peace to its neighbour.\n\n## Abiy's open invitation\n\nIn an open letter dated 23 November and published this week, Abiy invited Sudan's military, political and civilian groups to an inclusive dialogue hosted and sponsored by Ethiopia. The letter, titled \"An open invitation to all Sudanese parties to sit at the dialogue table,\" said the aim was to end the fighting, overcome divisions and reach a national consensus that could lay the foundations for lasting peace.\n\nAbiy said the talks could lead to a broadly supported \"government of national unity,\" the rebuilding of state institutions and the protection of Sudan's unity and sovereignty. He insisted that Ethiopia would treat all parties equally and was not driven by political interests. \"No externally imposed solution can deliver sustainable peace,\" he said. \"The true winner should be Sudan and its people.\"\n\nAbiy recalled Ethiopia's role in 2019, when Addis Ababa helped bring Sudan's military leaders and civilian protest movement together after the fall of former president Omar al-Bashir. He also called on the international community and regional organisations to support peace efforts and increase humanitarian aid. No date for talks was announced.\n\n## Khartoum says no\n\nOn Wednesday, 25 November, Sudan's government rejected the initiative. In a statement, it said Ethiopia lacked the neutrality needed to host or facilitate talks, accusing Addis Ababa of supporting the RSF — particularly on the Blue Nile front — and of allowing drones to be launched from its territory. Ethiopia has not accepted these accusations.\n\n## Others welcome it\n\nBy contrast, the RSF-aligned Sudan Founding Alliance, known as Ta'asis, and its self-declared \"Government of Peace\" welcomed the offer. A civilian coalition, the Civil Democratic Alliance of Revolutionary Forces (Sumoud), also praised Ethiopia's focus on ending the fighting and called for coordinated regional and international efforts to support a ceasefire and a Sudanese-owned peace process.\n\n## A war in its fourth year\n\nSudan's war broke out on 15 April 2023 between the Sudanese Armed Forces and the RSF. It has become one of the world's worst humanitarian crises, with millions forced from their homes and widespread hunger. Several international mediation efforts have so far failed to produce a lasting ceasefire.\n\n## Strained relations\n\nThe offer comes at a difficult time for relations between Ethiopia and Sudan. Khartoum has repeatedly accused Addis Ababa of backing the RSF and of allowing its territory to be used for drone attacks — accusations that were renewed after recent drone strikes on Khartoum. Ethiopia says Sudan's peace and stability are essential to the security of the whole Horn of Africa.\n\n## What it means\n\nFor now, the rejection by Sudan's internationally recognised government makes talks in Addis Ababa unlikely in the near future. But the initiative shows how much the region's leaders fear the war spreading further across borders — and how difficult it remains to find a mediator trusted by both sides.\n\n> Peace in Sudan matters for Ethiopia, for the Horn of Africa and for millions of Sudanese families waiting to return home.\n\nBarii News will follow the story.\n\nSources: Addis Standard; Sudan Tribune; Radio Dabanga; Radio Tamazuj; Dawan Africa; The Sudan Times; Daily News Egypt.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-26",
  "image": "barii-sudan-talks (1).jpg",
  "featured": true
 },
 {
  "id": "moyale-crisis-nearly-700-000-displaced-as-fighting-resumes-a",
  "kind": "oduu",
  "cat": "hawaasa",
  "title": "Moyale Crisis: Nearly 700,000 Displaced as Fighting Resumes After Short-Lived Ceasefire",
  "summary": "A month of clashes along the Oromia–Somali regional border in southern Ethiopia has forced hundreds of thousands of people from their homes. A ceasefire agreed last week lasted only four days.",
  "body": "A humanitarian crisis is deepening in southern Ethiopia. Nearly 700,000 people have been forced from their homes by fighting around Moyale, the busy border town on Ethiopia's frontier with Kenya, according to the humanitarian organisation Islamic Relief Ethiopia.\n\nThe violence, between forces and communities linked to the Oromia and Somali regions, has now lasted more than a month. A ceasefire reached last week brought brief hope, but fighting resumed on Monday, 23 November.\n\n## A divided town\n\nMoyale is a town with a complicated map. On the Ethiopian side, it is divided between two districts: one in the Borana Zone of the Oromia region and one in the Dawa Zone of the Somali region. Across the border lies Moyale in Kenya. The town is an important trade hub between Ethiopia and Kenya, and its markets serve pastoralist communities from all sides.\n\nDisputes over land, grazing and administrative boundaries in the area are not new. The town saw deadly clashes in 2012, and the wider Oromia–Somali border was the scene of major violence in 2016 and 2017.\n\n## How the latest fighting started\n\nAccording to media reports, the current clashes began on 18 October after a dispute linked to the opening of a Somali regional administration office in the area. Islamic Relief says large-scale fighting between Somali and Oromo communities began on 22 October. The violence has involved regional police forces from both regions as well as local militias, and heavy weapons have been reported.\n\nThe fighting has since spread up to 300 kilometres from Moyale into surrounding districts, including parts of the Borana Zone.\n\n## The human cost\n\nIslamic Relief estimates that about 688,800 people have been displaced: around 329,000 from the Dawa Zone in the Somali region and about 359,800 across southern Oromia. Homes have been destroyed and essential services disrupted. Tens of thousands of people have crossed the border into Kenya, where many families are living in difficult conditions in camps and host communities.\n\nTrade between Ethiopia and Kenya through Moyale has also been badly disrupted, affecting the livelihoods of traders, farmers and herders on both sides of the border.\n\n\"This is a volatile conflict driven by two ethnic groups competing for land and wealth in the borders of Ethiopia,\" said Kedir Musema Hameza, head of Islamic Relief's Ethiopia programme.\n\n## A ceasefire that did not hold\n\nLast week, representatives of the Oromia and Somali regions agreed to stop the fighting after talks facilitated by federal government representatives and elders from both communities. But hours after the agreement, negotiators came under gunfire from unidentified armed men in Moyale. The ceasefire lasted only four days before clashes resumed on 23 November, with reports of heavy artillery.\n\n## What is needed now\n\nHumanitarian agencies say displaced families urgently need food, clean water, shelter and health care. Children are out of school, and women and the elderly are particularly vulnerable.\n\nLasting peace will require more than a temporary ceasefire. Experts and community leaders have long called for a clear, fair and legally binding settlement of the regional boundary, accountability for violence against civilians, and support for traditional reconciliation mechanisms in which elders from both communities play a central role.\n\n> Oromo and Somali communities have lived side by side, traded and intermarried for generations. Peace in Moyale is in the interest of everyone.\n\n## How you can help\n\nReaders who wish to support those affected can donate through established humanitarian organisations working in the area. Please avoid sharing unverified videos or claims on social media, which can inflame tensions and put lives at risk.\n\nBarii News will continue to follow the situation.\n\nSources: Islamic Relief Ethiopia (via Citizen Digital, Arab News, Dawan Africa); Al Jazeera; Wazema Radio; Horn Frequency; Addis Standard.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25",
  "image": "barii-moyale.jpg"
 },

  "kind": "oduu",
  "cat": "saayinsii",
  "title": "Huawei Found Guilty in US of Fraud and Trade Secret Theft, but Cleared of Racketeering",
  "summary": "A New York jury convicted the Chinese tech giant on 10 of 12 counts linked to its business in Iran and to technology taken from US companies. Huawei says it will fight the verdict.",
  "body": "A federal jury in Brooklyn, New York, has found Chinese technology giant Huawei guilty in one of the most important criminal cases ever brought by the United States against a foreign company. After a trial lasting about three months, jurors on Tuesday, 24 November 2026, convicted Huawei and three of its subsidiaries on 10 of the 12 charges they faced.\n\nThe verdict brings an eight-year legal battle close to its end. But it was not a complete victory for prosecutors: the jury cleared Huawei of the most serious charge, racketeering conspiracy, which accused the company of operating as a criminal enterprise.\n\n## What Huawei was convicted of\n\nThe guilty verdicts cover bank fraud, wire fraud, violations of US sanctions on Iran, conspiracy to defraud the United States, money-laundering conspiracy and conspiracy to steal trade secrets. Three subsidiaries were also convicted: Huawei Device Co., Futurewei Technologies and Huawei Device USA. Jurors found Huawei not guilty of racketeering conspiracy and of conspiracy to obstruct justice.\n\n## The Iran connection\n\nAt the heart of the case was Huawei's business in Iran. Prosecutors said the company ran its Iran operations through Skycom, a company it secretly controlled, while telling banks such as HSBC that Skycom was only an independent business partner. According to prosecutors, these false statements helped Huawei obtain billions of dollars in loans and banking services while hiding activity that could break US sanctions.\n\nProsecutors also said Huawei's technology helped Iranian authorities monitor and censor internet users.\n\n## Secrets from American companies\n\nThe trade-secret charges involved technology from several US and international firms, including Cisco, T-Mobile, Motorola Solutions, Fujitsu and Quintel. Two examples became famous during the trial. Prosecutors said Huawei engineers copied Cisco router software and referred to the company in their notes as \"ocsic\" — Cisco spelled backwards. In another case, a Huawei employee allegedly removed part of \"Tappy,\" a phone-testing robot, from a restricted T-Mobile laboratory.\n\n## Huawei's response\n\nHuawei's lawyer, Brian Heberlig, said the company would appeal. He called the racketeering acquittal a vindication and said the verdict \"repudiated the central government narrative in the case.\" The defence argued during the trial that isolated misconduct by individual employees had been turned into a conspiracy that never existed, and that much of the allegedly stolen information was already public.\n\nIn a statement, Huawei said the five trade-secret disputes were civil matters settled long ago and that \"no court ever found Huawei liable for willful intellectual property misappropriation.\" The company said it would review the verdicts and take legal action.\n\n## The US government's view\n\nUS officials welcomed the decision. \"No person or company is above the law,\" said acting Attorney General Todd Blanche. Tysen Duva, head of the Justice Department's criminal division, said Huawei \"built its global empire on a foundation of fraud, theft, and deception.\"\n\n## What happens next\n\nSentencing has been set for 14 September 2027. Because Huawei is a company, it cannot be sent to prison; possible penalties include criminal fines, forfeiture of property and payments to victims. Appeals could keep the case in the courts for years.\n\n## A long story\n\nThe case began in 2018. In 2019, the US government placed Huawei on its \"entity list,\" a trade blacklist that restricted its access to American technology because of national security concerns. The case became a symbol of the wider technology rivalry between the United States and China — a rivalry that also includes battles over computer chips, 5G networks and artificial intelligence.\n\n## Why it matters for Africa\n\nHuawei is one of the most important technology companies in Africa. It has built large parts of the continent's mobile networks and sells many of the smartphones used by Africans. The verdict does not ban Huawei from doing business in Africa, and African governments make their own decisions about which companies to work with. But the case is a reminder that the US–China technology rivalry can affect the phones, networks and digital services that ordinary Africans rely on every day.\n\n> In the global race for technology, courts, trade rules and national security are now as important as innovation itself.\n\nSources: Reuters (via CNN); The Next Web; Quartz; Fox Business; The Jerusalem Post; Cryptopolitan; US Department of Justice.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25",
  "image": "barii-huawei-verdict.jpg"
 },

  "id": "ethiopia-s-exam-crisis-pass-rate-rises-to-12-8-but-nearly-ni",
  "kind": "oduu",
  "cat": "barnoota",
  "title": "Ethiopia's Exam Crisis: Pass Rate Rises to 12.8%, but Nearly Nine in Ten Students Still Fail",
  "summary": "This year's Grade 12 results were the best in five years. Behind the headline, however, lie hundreds of thousands of missing students, deep inequalities and a learning crisis that affects millions of children across Ethiopia and Africa.",
  "body": "Every year, hundreds of thousands of Ethiopian teenagers sit the Grade 12 national examination, the test that decides who can go to university. For most of them, the result is disappointing. In 2026, Ethiopia's Ministry of Education announced that about 70,500 of the 550,210 students who sat the exam scored 50% or more — a pass rate of 12.8%.\n\nThe government has presented this as progress, and in one sense it is. It is the strongest result in five years. But education experts warn that the number hides a much deeper crisis, one that begins long before students enter the exam hall.\n\n## From 3% to 12.8%\n\nTo understand the result, it is necessary to look back. In 2022, Ethiopia reformed its national exams to stop widespread cheating, including by holding them on university campuses under strict supervision. The first results after the reform were shocking: only about 3% of candidates reached the pass mark in 2022 and again in 2023. In 2023, 43% of schools reported that not a single one of their students had passed.\n\nSince then, the pass rate has climbed: to 5.4% in 2024, to about 9% in 2025 and now to 12.8%. Supporters of the reform say strict testing has finally shown the real level of learning in Ethiopian classrooms — and that the steady rise proves that schools are starting to respond.\n\n## What the headline number hides\n\nCritics point out three problems. First, the pass mark is just 50%, so the government is celebrating students who reached only half the possible score. Second, about 87% of those who sat the exam still failed.\n\nThird, and most important, the number of students taking the exam has fallen sharply. In 2022, 896,520 students sat the exam; in 2026, only 550,210 did — almost 350,000 fewer. Because the pass rate is a percentage, a smaller number of candidates can push the rate up even when the number of successful students barely changes. One analysis estimates that, based on population growth, hundreds of thousands of young people who should have reached Grade 12 this year never sat the exam at all.\n\n## Where did the students go?\n\nArmed conflict is the main reason. In several regions, schools have been damaged, occupied or closed, teachers have been killed, threatened or left unpaid, and displaced families have pulled children out of school. According to regional figures cited by the education research network NORRAG, the Amhara region had 4.1 million out-of-school children in 2024/25, while Oromia had 3.2 million out-of-school children in 2024. In Tigray, about 1.4 million children were pushed out of school during the 2020–2022 war.\n\nFalling real spending on education has made the situation worse. When budgets shrink, schools lack textbooks, laboratories and trained teachers — and the students who suffer most are those in rural areas and poor urban neighbourhoods.\n\n## Big gaps between students\n\nThe results also show large differences. Natural science students did better, with a pass rate of about 16.5%, while social science students lagged behind. Addis Ababa recorded the highest pass rate of any region. Students who took the exam on computers also achieved a higher pass rate. At the very top, some students achieved outstanding scores, with the highest result reported at 591.6 out of 600 — proof that excellence exists even within a struggling system.\n\n## A warning about fake news\n\nJust before the official announcement, a fake image circulated on social media claiming that 93% of students had passed. It was created with artificial intelligence. The real figure was 12.8%. The episode is a reminder for students and parents: always check exam results through the Ministry of Education's official channels.\n\n## A global problem\n\nEthiopia is not alone. According to UNESCO's 2026 Global Education Monitoring Report, the number of children and young people out of school worldwide has risen for the seventh year in a row, reaching 273 million. One in six school-age children is excluded from education, and only two in three complete secondary school. Sub-Saharan Africa is the most affected region, mainly because of conflict and rapid population growth.\n\n## What needs to change\n\nExperts recommend a set of priorities: peace, so that schools in conflict areas can reopen; more public money for education, used to train and pay teachers well; updated curricula; and full transparency, with the government publishing every year how many young people were eligible for the exam, how many sat it and how many passed — by region, gender and field of study.\n\n## Advice for students preparing for the exam\n\nResearch on learning shows that some study habits work much better than others. Two methods stand out. The first is practice testing: instead of rereading notes, close the book and try to answer questions from memory, using past exam papers, flashcards or a study partner. The second is spaced practice: study the same subject in short sessions spread over weeks, rather than cramming the night before.\n\nOther proven habits include sleeping well before the exam, mixing different subjects in a study session, and asking teachers to explain mistakes rather than just giving the right answer.\n\n> Exams measure what students know on one day. Education decides what a whole generation can do for the rest of their lives.\n\nFor Ethiopia, with one of the youngest populations in the world, fixing the learning crisis is not only a school issue. It is a question of the country's future.\n\nSources: NORRAG; The Reporter Ethiopia; Ethiopian Monitor; Addis Insight; Temari; UNESCO Global Education Monitoring Report 2026; Dunlosky et al. (2013), Psychological Science in the Public Interest.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25"
 },

  "title": "Zambia's Main Opposition Leader to Stand Trial for Treason After Disputed Election",
  "summary": "Brian Mundubile, who finished second to President Hakainde Hichilema in August, has been sent to the High Court on charges of plotting to overthrow the government. He says the case is politically motivated.",
  "body": "Zambia's main opposition leader, Brian Mundubile, will stand trial for treason. On Monday, 23 November 2026, a magistrate in the capital, Lusaka, committed Mundubile, his running mate Makebi Zulu and 12 others to the High Court — the court that handles the most serious criminal cases — on charges of plotting to overthrow the government by unlawful means.\n\nThe case is one of the most serious political trials in Zambia in years. It comes just three months after a general election that Mundubile lost to President Hakainde Hichilema and that the opposition still disputes.\n\n## What the prosecution alleges\n\nAccording to the charge sheet read in court, the accused prepared or attempted to overthrow the government between 1 April and 14 August 2026 — a period that ended the day after the election. The prosecution lists nine alleged acts. They include recruiting serving and retired soldiers through a military colonel, holding meetings and providing money and logistics.\n\nThe most striking allegation is that Mundubile and a businessman funded military training in Russia for five people and arranged their travel. The prosecution also alleges that Mundubile and six co-accused possessed weapons intended for the operation. Zulu and two others face an alternative charge of \"misprision of treason\" — knowing about a plot and failing to report it.\n\nOf 18 people originally accused, 14 have now been committed for trial. All of them remain in custody, and none has yet entered a plea. If convicted, Mundubile could face up to life in prison.\n\n## The defence: \"a fishing expedition\"\n\nMundubile, a former government minister and member of parliament, denies the charges and says they are politically motivated. His lawyer, Sakwiba Sikota, told reporters the charges \"did not make sense\" and described the prosecution as a \"fishing expedition.\" Sikota expects the trial to begin early next year. No date has yet been set by the High Court.\n\n## The disputed election\n\nTo understand the case, it is necessary to go back to 13 August 2026, when Zambians voted in a general election. President Hichilema of the United Party for National Development (UPND) won a second five-year term in the first round with about 60% of the vote, according to the Electoral Commission of Zambia. Mundubile, standing for an opposition alliance in his first presidential race, received about 38%. Turnout was much lower than in 2021.\n\n Mundubile rejected the result. He said his campaign had documented \"serious irregularities\" and claimed victory based on his party's own vote count. He alleged, among other things, that military personnel took control of tallying centres in some areas. Hichilema's campaign insisted the results were legitimate and accused the opposition of disruption. The president has rejected the fraud allegations.\n\nElection observers reported incidents of intimidation and violence during the campaign. Some analysts said the conduct of the election damaged Zambia's reputation as one of southern Africa's more stable democracies.\n\n## Arrest after the vote\n\nShortly after the election, Mundubile and Zulu were sought by police over alleged treason. Mundubile surrendered to police on 27 August after about two weeks in hiding and was formally charged two days later. He has been in custody since then.\n\n## Two very different stories\n\nThe government and prosecutors present the case as a matter of national security: an alleged plan to use force to remove an elected government. Supporters of the opposition see it as an attempt to silence the country's main challenger after a disputed vote. Some commentators have raised concerns about growing political pressure on opponents in Zambia.\n\nOnly a fair and transparent trial can establish the facts. The evidence presented in court — especially on the alleged training in Russia and the weapons — will be closely watched at home and abroad.\n\n## Why it matters beyond Zambia\n\nZambia has long been seen as an example of peaceful transfers of power in Africa. In 2021, Hichilema himself came to office by defeating a sitting president at the ballot box — after years in opposition, during which he too was once arrested and charged with treason, in 2017. That case was later dropped.\n\n> How Zambia handles this trial will be a test of its courts, its democracy and its commitment to the rule of law.\n\nBarii News will follow the case as it moves to the High Court.\n\nSources: Reuters (via CNBC Africa); Africanews; AllAfrica; The Rio Times; Al Jazeera; Bloomberg; US News.",

  "id": "africa-s-ai-power-gap-why-the-continent-has-just-0-6-of-the",
  "kind": "oduu",
  "cat": "saayinsii",
  "title": "Africa's AI Power Gap: Why the Continent Has Just 0.6% of the World's Data Centres — and the Race to Catch Up",
  "summary": "Artificial intelligence runs on giant data centres, and Africa has very few of them. New investments are arriving fast, but electricity, water and money may decide who wins the race.",
  "body": "Every time someone asks an AI chatbot a question, translates a sentence or uses a voice assistant, the work is done not on their phone but in a data centre — a building full of powerful computers that run day and night. These buildings are the factories of the digital age. And when it comes to these factories, Africa is far behind the rest of the world.\n\nAccording to a new analysis published this month by the British Institute for Strategic Insight (BISI), Africa accounts for only about 0.6% of global data-centre capacity. That is a striking figure for a continent that is home to almost one in five people on Earth, and whose population is the youngest and fastest-growing in the world.\n\n## How much capacity does Africa have?\n\nFigures from the Africa Data Centres Association show that the continent currently has about 360 megawatts (MW) of active data-centre capacity. Another 238 MW is under construction and 656 MW is planned. If all of this is built, Africa's capacity could reach about 1.2 gigawatts by 2030 — roughly three times today's level.\n\nThat sounds like a lot, but it is small on a global scale. Analysts expect Africa to remain below 1% of world capacity through 2030. A single giant AI data centre of one gigawatt — the kind now being built in the United States and the Gulf — would equal the entire continent's projected capacity.\n\nThe capacity that does exist is also concentrated in one country. South Africa holds more than 60% of Africa's operational data-centre capacity. Investment is expanding into Nigeria, Kenya, Egypt, Ghana, Ethiopia and Morocco, but most countries still have very little.\n\n## A fast-growing market\n\nThe demand is real and rising. Africa's artificial intelligence market is projected to grow from about US$4.5 billion in 2025 to US$16.5 billion by 2030. Banks, mobile-money services, hospitals, farmers using weather apps and governments delivering digital services all need computing power close to home.\n\nTelecom companies are moving quickly. On 10 November, Vodacom announced plans to build AI data centres across Africa through partnerships, starting with Egypt and expanding to South Africa and Kenya. In August, MTN announced plans for 150 MW of AI data-centre capacity in Nigeria and South Africa with a UAE-backed investor. In Lagos, which has become a regional hub, capacity is forecast to grow from about 79 MW to more than 218 MW by 2030.\n\n## Electricity: the biggest barrier\n\nBuilding the buildings is the easy part. Powering them is much harder. Data centres need huge amounts of stable, round-the-clock electricity, and AI systems need even more because their chips consume a lot of power and produce a lot of heat. According to the BISI analysis, electricity is now a bigger constraint than fibre-optic connections.\n\n> The problem is clearly visible in Kenya. A US$1 billion data-centre project involving Microsoft and the UAE technology company G42 was delayed in May 2026 over power supply and government payment guarantees. President William Ruto warned that supplying its power could mean cutting electricity to half the country. Officials say the project has not been cancelled, but it remains stalled.\n\nTo get around unreliable grids, many developers are building their own solar or gas power plants and backup connections. That makes projects more expensive and slower to complete.\n\n## Water and the environment\n\nData centres also need cooling, and many cooling systems use large amounts of water. In Cape Town, South Africa — a city that came close to running out of water in 2018 — two planned data centres totalling 174 MW are facing a legal challenge filed in August 2026. Critics say they could use more than 4.4 billion litres of water a year. The debate shows that the AI boom brings environmental questions that African communities will have to answer.\n\n## The money question\n\nExperts estimate that Africa's data-centre sector will need US$10–20 billion in new investment, while current commitments from big technology companies and others are around US$2.5–4 billion. Weak local currencies make the challenge harder: chips, servers and cooling equipment are imported and priced in dollars, so a falling currency quickly raises costs and debt payments.\n\n## Why \"data sovereignty\" matters\n\nThere is also a political dimension. When African data — from health records to bank transactions — is stored on servers in Europe or the United States, it may fall under foreign laws. As African countries adopt stronger data-protection rules, demand for local storage is expected to grow. Building data centres at home is increasingly seen as a matter of independence, not just business.\n\n## The global race\n\nThe stakes are rising because technology elsewhere is moving very fast. This week alone, the company Quantinuum reported a record in quantum error correction, with its 98-qubit Helios system achieving a failure rate of just 0.0005% in memory tests — a step towards powerful, reliable quantum computers. Countries and companies that control computing infrastructure will shape the next generation of technology.\n\n## What it means for Ethiopia and the region\n\nEthiopia, with a population of well over 120 million and a large young workforce, is among the countries where data-centre investment is beginning to expand. The country's hydropower — including the Grand Ethiopian Renaissance Dam — could become an advantage, because clean and relatively cheap electricity is exactly what data centres need. Turning that advantage into reality will require reliable transmission lines, fibre connections, clear regulations and trained engineers.\n\n## Small steps may win\n\nThe BISI analysis concludes that smaller projects, built in stages, are more likely to succeed in Africa than giant ones. The operators best placed to succeed are those with secure power, strong fibre connections, stable financing and reliable customers.\n\n> Africa does not need to copy Silicon Valley. It needs enough computing power, at home, to solve its own problems in its own languages.\n\nFor a continent with more than 2,000 languages — including Afaan Oromoo, spoken by tens of millions — local AI infrastructure could one day mean better translation, education, health advice and farming support for people who have long been left out of the digital world. The race has started. Whether Africa catches up will depend on decisions made in the next few years.\n\nSources: British Institute for Strategic Insight (BISI); Africa Data Centres Association; BusinessTech; Nairametrics; Engineering News; Live Science; Quantinuum.",
  "author": "Gulaalaa Barii News",

  "title": "Champions League Night: Real Madrid Run Riot as Barcelona, Liverpool and Bayern Head Into Big Matchday",
  "summary": "Real Madrid stay perfect after a 5-1 comeback win over PSV, Arsenal and Manchester City drop points, and nine more games kick off tonight. Full results, table and kick-off times.",
  "body": "The UEFA Champions League league phase reaches a decisive stage this week. After a dramatic Tuesday night, nine more matches are played tonight, Wednesday 25 November, with Barcelona, Liverpool, Bayern Munich, Paris Saint-Germain and Manchester United all in action.\n\n## Tuesday's big story: Real Madrid stay perfect\n\nReal Madrid produced the performance of the night, coming from behind to thrash PSV Eindhoven 5-1 at the Santiago Bernabéu. PSV stunned the home crowd by taking the lead in the 32nd minute, and they were still ahead at half-time. Real responded with three substitutions at the break and turned the game around in a 14-minute spell: they equalised in the 50th minute and scored again in the 60th and 64th minutes. Two late goals, in the 84th and 87th minutes, completed the rout.\n\nThe numbers tell the story: Real Madrid had 20 shots, nine on target, and 59% of possession. PSV managed only one shot on target all night. With five wins from five games and 15 points, Real Madrid are the only team in the competition with a perfect record.\n\n## Draws for Arsenal and Manchester City\n\nArsenal were held 1-1 at home by Borussia Dortmund. The Gunners scored after just ten minutes but could not find a second goal despite 25 shots, and Dortmund equalised ten minutes into the second half. Arsenal remain unbeaten, with three wins and two draws.\n\nManchester City needed a late goal to rescue a 2-2 draw against Napoli. The Italian side, featuring former City star Kevin De Bruyne, led twice — in the 55th and 76th minutes — but City equalised in the 67th and again in the 86th minute.\n\n## Other Tuesday results\n\nGalatasaray 1-0 Aston Villa\nBodø/Glimt 1-0 LASK Linz\nComo 1-0 AEK Athens\nFeyenoord 0-1 Porto\nRB Leipzig 3-1 Lens\nSlovan Bratislava 0-2 Real Betis\n\nComo, playing in the Champions League for the first time, continue their remarkable rise with a fourth win and sit third in the table.\n\n## The table at the top\n\n1. Real Madrid — 15 points (5 games)\n2. Paris Saint-Germain — 12 (4 games)\n3. Como — 12\n4. Real Betis — 12\n5. Arsenal — 11\n6. Manchester City — 10\n7. Borussia Dortmund — 10\n8. Barcelona — 9 (4 games)\n\nIn the new league format, the top eight teams qualify directly for the round of 16. Teams finishing 9th to 24th go into a play-off round, and the bottom 12 are eliminated.\n\n## Tonight's games (Riyadh and Addis Ababa time)\n\n20:45 — Sabah (Azerbaijan) vs Barcelona\n20:45 — Slavia Prague vs Villarreal\n23:00 — Atlético Madrid vs Viking\n23:00 — Club Brugge vs Liverpool\n23:00 — Inter vs Stuttgart\n23:00 — Shakhtar Donetsk vs Fenerbahçe\n23:00 — Lille vs Bayern Munich\n23:00 — Paris Saint-Germain vs Roma\n23:00 — Sporting CP vs Manchester United\n\n## Games to watch\n\nParis Saint-Germain vs Roma: PSG are one of only two unbeaten teams with a perfect record so far and can move level with Real Madrid on 15 points with a win.\n\nSporting CP vs Manchester United: Statistical models rate this as the most even game of the night. United have six points and need a result to climb into the top 24.\n\nClub Brugge vs Liverpool: Both teams have nine points. A Liverpool win would push them towards the top eight.\n\nLille vs Bayern Munich: Bayern are unbeaten but have drawn twice. Lille, with only one point, are fighting for survival.\n\nAtlético Madrid vs Viking: A worrying campaign for Diego Simeone's side, who have just four points. Anything less than a win would leave them in danger.\n\n> With three rounds left after this week, every point now matters in the race for the top eight.\n\nBarii News will update results after tonight's matches.\n\nSources: Sportradar match data; UEFA.",

  "title": "HIV at a Crossroads: Why the UN Warns Decades of Progress Could Unravel in 2027",
  "summary": "New HIV infections and AIDS deaths are at historic lows, but a new UNAIDS report warns that funding cuts could reverse the trend as early as next year. Here is what the numbers mean — and what every family can do.",
  "body": "Ahead of World AIDS Day on 1 December, the UN agency leading the global fight against AIDS has issued one of its starkest warnings in years. In its annual Global AIDS Update, released on Tuesday, 24 November 2026, UNAIDS said the world has never been closer to controlling the HIV pandemic — yet new infections could start rising again next year for the first time in years.\n\n\"We are on the cusp of ending AIDS – this has been the greatest story of global health – and just when we should finish it, cuts and the rolling back of human rights is threatening to take away our gains,\" said Winnie Byanyima, Executive Director of UNAIDS.\n\n## The good news: historic lows\n\nThe latest figures show how far the world has come. About 1.2 million people acquired HIV in 2025, down from 1.3 million the year before. Around 570,000 people died of AIDS-related causes in 2025 — still almost 1,600 deaths every day, but down from 600,000 in 2024 and 1.3 million in 2010.\n\nToday about 40 million people live with HIV, and about 32.1 million of them are receiving treatment. As UNAIDS puts it, HIV was once a death sentence but has become a manageable health condition for millions of people thanks to life-saving medicines.\n\n## The warning: money is running out\n\nThe progress is now under threat. International funding for HIV programmes has fallen sharply since the 2025 aid cuts, with US government cuts having a particularly dramatic impact. Low- and middle-income countries now face a funding gap of about US$4.3 billion.\n\nThe effects are already visible:\n\n- About 446,000 fewer people received PrEP (medicine that prevents HIV) in 2025 than in 2024.\n- Condom distribution fell from 3 billion to 2.7 billion.\n- Voluntary medical male circumcision, which lowers men's risk of HIV, dropped by 53% in priority countries.\n- More than three-quarters of community organisations reported disruptions to their services.\n\nMany African countries depend heavily on outside money. External resources make up as much as 98% of HIV funding in Nigeria, 94% in Mozambique and 80% in Uganda. UNAIDS warns that the worst effects of the 2025 cuts may still be ahead, with rising infections, illness and deaths expected if services keep shrinking.\n\n> \"We know what happens when HIV prevention collapses,\" Byanyima said.\n\n## A breakthrough at the worst possible time\n\nThe irony is painful. The world now has one of the most powerful prevention tools ever developed: lenacapavir, an injection given just twice a year that has shown near-total protection against HIV in clinical trials. Eswatini and Zambia became the first sub-Saharan African countries to offer it in late 2025, and South Africa — the country with the highest HIV burden — launched it in June 2026. By mid-2026, it was rolling out across Africa faster than any previous HIV prevention option.\n\nBut UNAIDS says prevention programmes like these have been hit especially hard by funding cuts. Supplies remain limited, and the people who need them most are often the hardest to reach.\n\n## Why it matters for Africa\n\nSub-Saharan Africa is home to about two-thirds of all people living with HIV in the world. Young women and adolescent girls remain especially vulnerable. When clinics close, outreach workers lose their jobs and testing drops, HIV spreads silently — often for years before people know they are infected.\n\nUNAIDS estimates that if the world reaches its 2030 goals, 3.2 million new infections could be prevented and 1.3 million AIDS-related deaths averted.\n\n## What every person and family can do\n\nGet tested. Knowing your status is the first step. HIV tests are quick, confidential and often free at health centres.\n\nIf you test positive, start treatment early and take it every day. People living with HIV who take their medicine consistently can live long, healthy lives. When treatment keeps the virus at undetectable levels, HIV is not passed on to sexual partners.\n\nUse prevention. Condoms remain highly effective. Ask your health centre whether PrEP — daily pills or the new long-acting injection — is available for you.\n\nProtect babies. Pregnant women should be tested. With treatment, mothers living with HIV can give birth to children who are HIV-free.\n\nFight stigma. Fear and shame keep people from getting tested and treated. Treat people living with HIV with respect and support.\n\n> Ending AIDS is still possible. Whether it happens depends on decisions made by governments, donors — and communities — in the next few years.\n\nSources: UNAIDS Global AIDS Update 2026; UN News; Reuters; AFP; aidsmap; NPR; The Global Fund; US CDC.",

 {
  "id": "senegal-are-champions-again-sports-court-hands-back-africa-c",

  "title": "Senegal Are Champions Again: Sports Court Hands Back Africa Cup Title After Morocco Ruling",
  "summary": "More than ten months after a chaotic final in Rabat, the Court of Arbitration for Sport has overturned CAF's decision and restored Senegal's 1-0 victory over Morocco.",
  "body": "Senegal are Africa's football champions once again. On Tuesday, 24 November, the Court of Arbitration for Sport (CAS) in Lausanne, Switzerland, overturned an earlier ruling that had taken the 2025 Africa Cup of Nations (AFCON) title from Senegal and given it to Morocco.\n\n## A final like no other\n\nThe final was played in January at the Prince Moulay Abdellah Stadium in Rabat, Morocco. With the score at 0-0 in the last minute of regulation time, Morocco was awarded a penalty. Senegal's players walked off the field in protest, and the match was delayed for about 15 minutes. Referee Jean-Jacques Ndala of Congo then allowed the game to restart. Brahim Díaz's penalty was saved, and Senegal went on to win 1-0 in extra time.\n\n## The title taken away\n\nIn March, the appeal board of the Confederation of African Football (CAF) overturned the result. It ruled that Senegal had forfeited the final by leaving the pitch and recorded a 3-0 win for Morocco. Senegal's football federation called the decision unfair and took the case to CAS.\n\n## Why CAS ruled for Senegal\n\nCAS said the forfeit rules apply only when a team's conduct leads the referee to call off the match permanently. Because the referee restarted the game, the result on the field should stand. The court also found that Ndala \"did not err in law\" when he resumed play. The original 1-0 result was restored.\n\n> \"Once again and forever, champions of Africa,\" the Senegalese football federation celebrated.\n\n## What comes next\n\nMorocco's football federation has announced plans to appeal, targeting one of the three judges on the CAS panel. CAS decisions can be challenged before Switzerland's Federal Supreme Court, but only on limited procedural grounds.\n\nThe ruling gives Senegal their second African title, after their first win in 2021. It closes, for now, one of the most dramatic chapters in African football history.\n\nSources: ESPN, Associated Press, Fox Sports, NPR, AllAfrica.",

  "title": "US Proposes New Tariffs on 14 Trading Partners, With China and Vietnam Facing 20%",
  "summary": "After an eight-month investigation into \"excess industrial capacity,\" Washington plans new import duties on China, the EU, Japan, India and others. Mexico and Norway are spared for now.",
  "body": "The United States on Wednesday, 25 November, proposed new tariffs on 14 major trading partners, saying they produce far more industrial goods than their markets need — often with government subsidies — and flood world markets with cheap exports.\n\nThe US Trade Representative's office announced the plan after completing an eight-month investigation under Section 301 of the Trade Act of 1974. The investigation covered 16 \n\n> economies, including close US allies such as Japan, the European Union and South Korea.\n\n## Who is affected?\n\nThe 14 partners named are China, Bangladesh, Cambodia, the European Union, India, Indonesia, Japan, South Korea, Malaysia, Singapore, Switzerland, Taiwan, Thailand and Vietnam. China would face the highest rates, with a proposed 20% \"excess-capacity\" tariff on top of tariffs from Donald Trump's first term. Vietnam also faces a proposed 20% rate.\n\nMexico and Norway, also part of the investigation, were left out \"for the time being\" while their cases are still being reviewed. Existing trade agreements cap tariffs for some partners: 15% for the EU, Japan, South Korea and Taiwan, and 19% for Malaysia.\n\n## Why now?\n\nIn February, the US Supreme Court struck down much of President Trump's earlier global tariff programme. The administration launched the overcapacity investigation in March, and the new duties are widely seen as a way to rebuild those tariffs. The move also comes after Trump's Republican Party suffered major losses in this month's midterm elections.\n\n## What happens next\n\nThe proposed tariffs must go through a public comment period and a hearing before they take effect, which could push implementation into January. China rejected the accusations, saying its exports reflect real competitive advantages. A US official said Washington is \"seeking stability\" with Beijing and does not expect retaliation. The US–China trade truce is due to expire on 10 January.\n\n> Tariffs are taxes on imports. They are usually paid by importers and often passed on to consumers through higher prices.\n\n## Why it matters for Africa\n\nWhen the world's largest economies raise trade barriers, global demand can slow and prices of manufactured goods can rise. African exporters of raw materials may feel the effects through weaker demand and price swings.\n\nSources: Reuters, CNBC, Business Recorder, The Globe and Mail.",

  "title": "Strait of Hormuz on the Edge: Iran Says Tankers Hit Mines as Standoff With US Deepens",
  "summary": "Iran says more oil tankers caught fire after striking mines in the world's most important oil route, as Tehran vows to keep the strait closed until its demands are met.",
  "body": "Tension in the Strait of Hormuz — the narrow sea lane between Iran and Oman through which a large share of the world's oil passes — rose again this week. Iran's Islamic Revolutionary Guard Corps (IRGC) Navy said on Wednesday, 25 November, that two oil tankers struck naval mines, exploded and caught fire in the strait. The statement was carried by Iranian state media.\n\nThe announcement came a day after Iranian forces said three tankers had caught fire after hitting mines. Iran says the ships had tried to use \"unauthorised\" routes and had not coordinated their passage with Iranian forces. These claims have not been independently confirmed. The UK Maritime Trade Operations centre (UKMTO) separately reported unidentified projectiles striking commercial ships in the same area; crews were reported safe and the ships continued their voyages.\n\n## How did we get here?\n\nThe current crisis began with the 2026 war involving Iran, Israel and the United States, which started on 28 February. Iran responded by restricting traffic through the Strait of Hormuz, which led to a global fuel crisis and rising living costs around the world. After peace talks in Islamabad, Pakistan, failed in April, the United States imposed a naval blockade on Iranian ports from 13 April.\n\n## \"Closed further day by day\"\n\nOn Monday, Iran's army commander-in-chief ordered the navy to close the strait \"further day by day\" until Washington meets Tehran's conditions. Iran has said it will not restore normal shipping until its demands are met — reportedly seven conditions, including the lifting of the US naval blockade.\n\nWashington, meanwhile, is increasing economic pressure. The US Treasury this week widened sanctions on more than two dozen Iranian exchange houses, front companies and key individuals.\n\n## Diplomacy\n\nQatar is working to revive peace talks between the two sides, but no new round of negotiations has been announced.\n\n> For ordinary people far from the Gulf, the crisis is felt at the petrol station and the market: when oil cannot move freely, fuel and food prices rise everywhere.\n\n## What it means for Africa\n\nMany African countries import most of their fuel. Higher shipping and insurance costs for tankers quickly push up transport costs, food prices and inflation — especially in East Africa, which depends heavily on fuel imported through Gulf routes.\n\nSources: The Jerusalem Post, CNBC, Gulf News, Reuters, Euronews.",

  "title": "The Oromo People: A Living Heritage of Democracy, Language and Thanksgiving",
  "summary": "Ethiopia's largest ethnic group carries one of Africa's richest cultural heritages — from the Gadaa system recognised by UNESCO to the Irreecha festival and the Qubee alphabet.",
  "body": "The Oromo are the largest ethnic group in Ethiopia and one of the largest peoples in Africa. They live mainly in the Oromia region, which stretches across the heart of Ethiopia from the border with South Sudan in the west to the Somali region in the east and to Kenya in the south. Oromo communities also live in northern Kenya and in a growing diaspora around the world.\n\nAccording to Ethiopia's last national census in 2007, the Oromo numbered about 25.5 million people, or 34.5% of the population. More recent estimates put the number at around 45 million. Their language, Afaan Oromoo, belongs to the Cushitic branch of the Afro-Asiatic language family and is one of the most widely spoken languages in Africa.\n\n## Gadaa: an African system of democracy\n\nAt the centre of Oromo civilisation stands the Gadaa system — a traditional system of governance developed over many generations. Gadaa regulates political, economic, social and religious life, including conflict resolution and the protection of women's rights.\n\nGadaa is organised into five classes. Each class moves through a series of grades, and leadership rotates every eight years. The elected leader, the Abbaa Gadaa, serves a fixed term and then hands over power peacefully. Meetings and ceremonies traditionally take place under the Odaa, the sycamore tree, which is the symbol of Gadaa. Oral historians teach the younger generation history, laws, rituals, time reckoning and rules of conduct.\n\nIn 2016, UNESCO inscribed the Gadaa system on its Representative List of the Intangible Cultural Heritage of Humanity. The decision was made in Addis Ababa, where Ethiopia hosted the UNESCO committee that year.\n\n> Gadaa shows that ideas such as term limits, peaceful transfer of power and public deliberation have deep roots in Africa.\n\n## Siiqqee: the voice and authority of women\n\nAlongside Gadaa stands the Siiqqee institution. The Siiqqee is a thin, decorated stick that a mother traditionally gives her daughter on her wedding day, as a symbol of support and solidarity among women. Researchers describe it as a parallel institution that worked as a check and balance within the Gadaa system. When a woman's rights were violated, women could gather with their Siiqqee sticks and stay together until the wrong was put right. Today, Siiqqee is often cited as an indigenous model of women's participation in peacebuilding.\n\n## Irreecha: a festival of thanksgiving\n\nEvery year at the end of the long rainy season, millions of Oromo gather to celebrate Irreecha, a festival of thanksgiving to Waaqa (God) for bringing them safely through the dark and rainy months and for the coming harvest. People carry fresh green grass and flowers to the water's edge, wear traditional clothes in black, red and white, and bless one another with wishes of peace.\n\nThe best-known celebration takes place at Lake Hora Harsadi in Bishoftu, about 45 kilometres south-east of Addis Ababa. In recent years, Hora Finfinnee in Addis Ababa has become a second major venue. There are two forms of the festival: Irreecha Malkaa, held by rivers and lakes, and Irreecha Tulluu, held on hills and mountains.\n\n## Afaan Oromoo and the Qubee alphabet\n\n> For much of the twentieth century, Afaan Oromoo was not freely used in writing and education. Between 1974 and 1991, under the military government, writing the language in any script was forbidden, apart from limited use of the Ethiopic script.\n\nIn 1991 the Oromo formally adopted Qubee, an alphabet based on Latin letters, as the official script for Afaan Oromoo. The decision was taken at a meeting of Oromo intellectuals on 3 November 1991. It is believed that more texts were written in Afaan Oromoo between 1991 and 1997 than in the previous hundred years. Today Afaan Oromoo is used in schools, universities, media and government, and it is one of the official working languages of Ethiopia.\n\n## A long history\n\nHistorians record that Oromo communities lived for centuries in southern Ethiopia and northern Kenya. From around 1530, after the Ethiopian–Adal war, the Oromo expanded north and west across much of present-day Ethiopia. In the late nineteenth century, Oromo lands were incorporated into the expanding Ethiopian state. The struggle to protect Oromo identity, language and culture has shaped Oromo history ever since.\n\n## Faith and daily life\n\nThe Oromo practise several religions. Most are Muslim or Christian, while some follow Waaqeffannaa, the indigenous Oromo faith centred on one God, Waaqa. Many Oromo of every faith still use the name Waaqa for God. Traditional values such as respect for elders, hospitality, peace (nagaa) and care for nature remain part of everyday life.\n\n## Why it matters today\n\nOromo culture offers the world more than history. Gadaa's ideas of rotation and accountability, Siiqqee's defence of women's dignity and Irreecha's message of gratitude and peace speak to challenges every society faces. Protecting and passing on this heritage — at home, in school and online — is a responsibility for the new generation.\n\nSources: UNESCO Intangible Cultural Heritage; Encyclopaedia Britannica; Jimma University Journal of Humanities and Social Sciences (Gadaa journal); Addis Standard; The Reporter Ethiopia; AllAfrica; Al Jazeera; University of Pennsylvania African Studies Center.",

  "title": "25 November: One in Three Women Face Violence — and the World Is Not Moving Fast Enough",
  "summary": "Today, 25 November, is the International Day for the Elimination of Violence against Women. \" According to the World Health Organization (WHO), nearly one in three women worldwide — an estimated 840 million — have experienced physical or sexual violence from a partner, or…",
  "body": "Today, 25 November, is the International Day for the Elimination of Violence against Women. It opens the global 16 Days of Activism, which run until 10 December, Human Rights Day. This year's theme is \"UNiTE to End Violence Against Women and Girls: Ensure justice, protect survivors, end impunity.\"\n\n## The scale of the problem\n\nAccording to the World Health Organization (WHO), nearly one in three women worldwide — an estimated 840 million — have experienced physical or sexual violence from a partner, or sexual violence from someone else, during their lifetime. That figure \n\n> has barely changed since 2000.\n\nIn the past twelve months alone, about 316 million women — 11% of women aged 15 and older — were subjected to physical or sexual violence by an intimate partner. The WHO report also found that violence often begins early: millions of young women aged 15 to 19 are affected each year.\n\n## Prevention is underfunded\n\nExperts say we know what works — education, economic support for women, laws that are enforced, and services for survivors. Yet in 2022 only 0.2% of global development aid went to programmes focused on preventing violence against women, and funding fell further in 2025.\n\n> Violence against women is not a private matter. It harms health, families, communities and whole economies.\n\n## What communities can do\n\nBelieve and support survivors, and help them reach health and legal services. Teach boys and girls about respect and equality from an early age. Ask local leaders, religious leaders and elders to speak out publicly. Know your country's emergency and support numbers.\n\nIf you or someone you know is in danger, contact local emergency services or a trusted health worker.\n\nSources: World Health Organization, UN Women, UN News.",

  "id": "imf-sees-global-growth-slowing-to-3-1-in-2026-as-inflation-r",
