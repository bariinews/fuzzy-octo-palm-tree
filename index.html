  "title": "HIV at a Crossroads: Why the UN Warns Decades of Progress Could Unravel in 2027",
  "summary": "New HIV infections and AIDS deaths are at historic lows, but a new UNAIDS report warns that funding cuts could reverse the trend as early as next year. Here is what the numbers mean — and what every family can do.",
  "body": "Ahead of World AIDS Day on 1 December, the UN agency leading the global fight against AIDS has issued one of its starkest warnings in years. In its annual Global AIDS Update, released on Tuesday, 24 November 2026, UNAIDS said the world has never been closer to controlling the HIV pandemic — yet new infections could start rising again next year for the first time in years.\n\n\"We are on the cusp of ending AIDS – this has been the greatest story of global health – and just when we should finish it, cuts and the rolling back of human rights is threatening to take away our gains,\" said Winnie Byanyima, Executive Director of UNAIDS.\n\n## The good news: historic lows\n\nThe latest figures show how far the world has come. About 1.2 million people acquired HIV in 2025, down from 1.3 million the year before. Around 570,000 people died of AIDS-related causes in 2025 — still almost 1,600 deaths every day, but down from 600,000 in 2024 and 1.3 million in 2010.\n\nToday about 40 million people live with HIV, and about 32.1 million of them are receiving treatment. As UNAIDS puts it, HIV was once a death sentence but has become a manageable health condition for millions of people thanks to life-saving medicines.\n\n## The warning: money is running out\n\nThe progress is now under threat. International funding for HIV programmes has fallen sharply since the 2025 aid cuts, with US government cuts having a particularly dramatic impact. Low- and middle-income countries now face a funding gap of about US$4.3 billion.\n\nThe effects are already visible:\n\n- About 446,000 fewer people received PrEP (medicine that prevents HIV) in 2025 than in 2024.\n- Condom distribution fell from 3 billion to 2.7 billion.\n- Voluntary medical male circumcision, which lowers men's risk of HIV, dropped by 53% in priority countries.\n- More than three-quarters of community organisations reported disruptions to their services.\n\nMany African countries depend heavily on outside money. External resources make up as much as 98% of HIV funding in Nigeria, 94% in Mozambique and 80% in Uganda. UNAIDS warns that the worst effects of the 2025 cuts may still be ahead, with rising infections, illness and deaths expected if services keep shrinking.\n\n> \"We know what happens when HIV prevention collapses,\" Byanyima said.\n\n## A breakthrough at the worst possible time\n\nThe irony is painful. The world now has one of the most powerful prevention tools ever developed: lenacapavir, an injection given just twice a year that has shown near-total protection against HIV in clinical trials. Eswatini and Zambia became the first sub-Saharan African countries to offer it in late 2025, and South Africa — the country with the highest HIV burden — launched it in June 2026. By mid-2026, it was rolling out across Africa faster than any previous HIV prevention option.\n\nBut UNAIDS says prevention programmes like these have been hit especially hard by funding cuts. Supplies remain limited, and the people who need them most are often the hardest to reach.\n\n## Why it matters for Africa\n\nSub-Saharan Africa is home to about two-thirds of all people living with HIV in the world. Young women and adolescent girls remain especially vulnerable. When clinics close, outreach workers lose their jobs and testing drops, HIV spreads silently — often for years before people know they are infected.\n\nUNAIDS estimates that if the world reaches its 2030 goals, 3.2 million new infections could be prevented and 1.3 million AIDS-related deaths averted.\n\n## What every person and family can do\n\nGet tested. Knowing your status is the first step. HIV tests are quick, confidential and often free at health centres.\n\nIf you test positive, start treatment early and take it every day. People living with HIV who take their medicine consistently can live long, healthy lives. When treatment keeps the virus at undetectable levels, HIV is not passed on to sexual partners.\n\nUse prevention. Condoms remain highly effective. Ask your health centre whether PrEP — daily pills or the new long-acting injection — is available for you.\n\nProtect babies. Pregnant women should be tested. With treatment, mothers living with HIV can give birth to children who are HIV-free.\n\nFight stigma. Fear and shame keep people from getting tested and treated. Treat people living with HIV with respect and support.\n\n> Ending AIDS is still possible. Whether it happens depends on decisions made by governments, donors — and communities — in the next few years.\n\nSources: UNAIDS Global AIDS Update 2026; UN News; Reuters; AFP; aidsmap; NPR; The Global Fund; US CDC.",

 {
  "id": "senegal-are-champions-again-sports-court-hands-back-africa-c",

  "title": "Senegal Are Champions Again: Sports Court Hands Back Africa Cup Title After Morocco Ruling",
  "summary": "More than ten months after a chaotic final in Rabat, the Court of Arbitration for Sport has overturned CAF's decision and restored Senegal's 1-0 victory over Morocco.",
  "body": "Senegal are Africa's football champions once again. On Tuesday, 24 November, the Court of Arbitration for Sport (CAS) in Lausanne, Switzerland, overturned an earlier ruling that had taken the 2025 Africa Cup of Nations (AFCON) title from Senegal and given it to Morocco.\n\n## A final like no other\n\nThe final was played in January at the Prince Moulay Abdellah Stadium in Rabat, Morocco. With the score at 0-0 in the last minute of regulation time, Morocco was awarded a penalty. Senegal's players walked off the field in protest, and the match was delayed for about 15 minutes. Referee Jean-Jacques Ndala of Congo then allowed the game to restart. Brahim Díaz's penalty was saved, and Senegal went on to win 1-0 in extra time.\n\n## The title taken away\n\nIn March, the appeal board of the Confederation of African Football (CAF) overturned the result. It ruled that Senegal had forfeited the final by leaving the pitch and recorded a 3-0 win for Morocco. Senegal's football federation called the decision unfair and took the case to CAS.\n\n## Why CAS ruled for Senegal\n\nCAS said the forfeit rules apply only when a team's conduct leads the referee to call off the match permanently. Because the referee restarted the game, the result on the field should stand. The court also found that Ndala \"did not err in law\" when he resumed play. The original 1-0 result was restored.\n\n> \"Once again and forever, champions of Africa,\" the Senegalese football federation celebrated.\n\n## What comes next\n\nMorocco's football federation has announced plans to appeal, targeting one of the three judges on the CAS panel. CAS decisions can be challenged before Switzerland's Federal Supreme Court, but only on limited procedural grounds.\n\nThe ruling gives Senegal their second African title, after their first win in 2021. It closes, for now, one of the most dramatic chapters in African football history.\n\nSources: ESPN, Associated Press, Fox Sports, NPR, AllAfrica.",

  "title": "US Proposes New Tariffs on 14 Trading Partners, With China and Vietnam Facing 20%",
  "summary": "After an eight-month investigation into \"excess industrial capacity,\" Washington plans new import duties on China, the EU, Japan, India and others. Mexico and Norway are spared for now.",
  "body": "The United States on Wednesday, 25 November, proposed new tariffs on 14 major trading partners, saying they produce far more industrial goods than their markets need — often with government subsidies — and flood world markets with cheap exports.\n\nThe US Trade Representative's office announced the plan after completing an eight-month investigation under Section 301 of the Trade Act of 1974. The investigation covered 16 \n\n> economies, including close US allies such as Japan, the European Union and South Korea.\n\n## Who is affected?\n\nThe 14 partners named are China, Bangladesh, Cambodia, the European Union, India, Indonesia, Japan, South Korea, Malaysia, Singapore, Switzerland, Taiwan, Thailand and Vietnam. China would face the highest rates, with a proposed 20% \"excess-capacity\" tariff on top of tariffs from Donald Trump's first term. Vietnam also faces a proposed 20% rate.\n\nMexico and Norway, also part of the investigation, were left out \"for the time being\" while their cases are still being reviewed. Existing trade agreements cap tariffs for some partners: 15% for the EU, Japan, South Korea and Taiwan, and 19% for Malaysia.\n\n## Why now?\n\nIn February, the US Supreme Court struck down much of President Trump's earlier global tariff programme. The administration launched the overcapacity investigation in March, and the new duties are widely seen as a way to rebuild those tariffs. The move also comes after Trump's Republican Party suffered major losses in this month's midterm elections.\n\n## What happens next\n\nThe proposed tariffs must go through a public comment period and a hearing before they take effect, which could push implementation into January. China rejected the accusations, saying its exports reflect real competitive advantages. A US official said Washington is \"seeking stability\" with Beijing and does not expect retaliation. The US–China trade truce is due to expire on 10 January.\n\n> Tariffs are taxes on imports. They are usually paid by importers and often passed on to consumers through higher prices.\n\n## Why it matters for Africa\n\nWhen the world's largest economies raise trade barriers, global demand can slow and prices of manufactured goods can rise. African exporters of raw materials may feel the effects through weaker demand and price swings.\n\nSources: Reuters, CNBC, Business Recorder, The Globe and Mail.",

 {
  "id": "strait-of-hormuz-on-the-edge-iran-says-tankers-hit-mines-as",
  "kind": "oduu",
  "cat": "addunyaa",
  "title": "Strait of Hormuz on the Edge: Iran Says Tankers Hit Mines as Standoff With US Deepens",
  "summary": "Iran says more oil tankers caught fire after striking mines in the world's most important oil route, as Tehran vows to keep the strait closed until its demands are met.",
  "body": "Tension in the Strait of Hormuz — the narrow sea lane between Iran and Oman through which a large share of the world's oil passes — rose again this week. Iran's Islamic Revolutionary Guard Corps (IRGC) Navy said on Wednesday, 25 November, that two oil tankers struck naval mines, exploded and caught fire in the strait. The statement was carried by Iranian state media.\n\nThe announcement came a day after Iranian forces said three tankers had caught fire after hitting mines. Iran says the ships had tried to use \"unauthorised\" routes and had not coordinated their passage with Iranian forces. These claims have not been independently confirmed. The UK Maritime Trade Operations centre (UKMTO) separately reported unidentified projectiles striking commercial ships in the same area; crews were reported safe and the ships continued their voyages.\n\n## How did we get here?\n\nThe current crisis began with the 2026 war involving Iran, Israel and the United States, which started on 28 February. Iran responded by restricting traffic through the Strait of Hormuz, which led to a global fuel crisis and rising living costs around the world. After peace talks in Islamabad, Pakistan, failed in April, the United States imposed a naval blockade on Iranian ports from 13 April.\n\n## \"Closed further day by day\"\n\nOn Monday, Iran's army commander-in-chief ordered the navy to close the strait \"further day by day\" until Washington meets Tehran's conditions. Iran has said it will not restore normal shipping until its demands are met — reportedly seven conditions, including the lifting of the US naval blockade.\n\nWashington, meanwhile, is increasing economic pressure. The US Treasury this week widened sanctions on more than two dozen Iranian exchange houses, front companies and key individuals.\n\n## Diplomacy\n\nQatar is working to revive peace talks between the two sides, but no new round of negotiations has been announced.\n\n> For ordinary people far from the Gulf, the crisis is felt at the petrol station and the market: when oil cannot move freely, fuel and food prices rise everywhere.\n\n## What it means for Africa\n\nMany African countries import most of their fuel. Higher shipping and insurance costs for tankers quickly push up transport costs, food prices and inflation — especially in East Africa, which depends heavily on fuel imported through Gulf routes.\n\nSources: The Jerusalem Post, CNBC, Gulf News, Reuters, Euronews.",
  "author": "Gulaalaa Barii News Abdisa",
  "date": "2026-11-25",
  "image": "barii-hormuz.jpg"
 },
 {
  "id": "the-oromo-people-a-living-heritage-of-democracy-language-and",
  "kind": "oduu",
  "cat": "aadaa",
  "title": "The Oromo People: A Living Heritage of Democracy, Language and Thanksgiving",
  "summary": "Ethiopia's largest ethnic group carries one of Africa's richest cultural heritages — from the Gadaa system recognised by UNESCO to the Irreecha festival and the Qubee alphabet.",
  "body": "The Oromo are the largest ethnic group in Ethiopia and one of the largest peoples in Africa. They live mainly in the Oromia region, which stretches across the heart of Ethiopia from the border with South Sudan in the west to the Somali region in the east and to Kenya in the south. Oromo communities also live in northern Kenya and in a growing diaspora around the world.\n\nAccording to Ethiopia's last national census in 2007, the Oromo numbered about 25.5 million people, or 34.5% of the population. More recent estimates put the number at around 45 million. Their language, Afaan Oromoo, belongs to the Cushitic branch of the Afro-Asiatic language family and is one of the most widely spoken languages in Africa.\n\n## Gadaa: an African system of democracy\n\nAt the centre of Oromo civilisation stands the Gadaa system — a traditional system of governance developed over many generations. Gadaa regulates political, economic, social and religious life, including conflict resolution and the protection of women's rights.\n\nGadaa is organised into five classes. Each class moves through a series of grades, and leadership rotates every eight years. The elected leader, the Abbaa Gadaa, serves a fixed term and then hands over power peacefully. Meetings and ceremonies traditionally take place under the Odaa, the sycamore tree, which is the symbol of Gadaa. Oral historians teach the younger generation history, laws, rituals, time reckoning and rules of conduct.\n\nIn 2016, UNESCO inscribed the Gadaa system on its Representative List of the Intangible Cultural Heritage of Humanity. The decision was made in Addis Ababa, where Ethiopia hosted the UNESCO committee that year.\n\n> Gadaa shows that ideas such as term limits, peaceful transfer of power and public deliberation have deep roots in Africa.\n\n## Siiqqee: the voice and authority of women\n\nAlongside Gadaa stands the Siiqqee institution. The Siiqqee is a thin, decorated stick that a mother traditionally gives her daughter on her wedding day, as a symbol of support and solidarity among women. Researchers describe it as a parallel institution that worked as a check and balance within the Gadaa system. When a woman's rights were violated, women could gather with their Siiqqee sticks and stay together until the wrong was put right. Today, Siiqqee is often cited as an indigenous model of women's participation in peacebuilding.\n\n## Irreecha: a festival of thanksgiving\n\nEvery year at the end of the long rainy season, millions of Oromo gather to celebrate Irreecha, a festival of thanksgiving to Waaqa (God) for bringing them safely through the dark and rainy months and for the coming harvest. People carry fresh green grass and flowers to the water's edge, wear traditional clothes in black, red and white, and bless one another with wishes of peace.\n\nThe best-known celebration takes place at Lake Hora Harsadi in Bishoftu, about 45 kilometres south-east of Addis Ababa. In recent years, Hora Finfinnee in Addis Ababa has become a second major venue. There are two forms of the festival: Irreecha Malkaa, held by rivers and lakes, and Irreecha Tulluu, held on hills and mountains.\n\n## Afaan Oromoo and the Qubee alphabet\n\n> For much of the twentieth century, Afaan Oromoo was not freely used in writing and education. Between 1974 and 1991, under the military government, writing the language in any script was forbidden, apart from limited use of the Ethiopic script.\n\nIn 1991 the Oromo formally adopted Qubee, an alphabet based on Latin letters, as the official script for Afaan Oromoo. The decision was taken at a meeting of Oromo intellectuals on 3 November 1991. It is believed that more texts were written in Afaan Oromoo between 1991 and 1997 than in the previous hundred years. Today Afaan Oromoo is used in schools, universities, media and government, and it is one of the official working languages of Ethiopia.\n\n## A long history\n\nHistorians record that Oromo communities lived for centuries in southern Ethiopia and northern Kenya. From around 1530, after the Ethiopian–Adal war, the Oromo expanded north and west across much of present-day Ethiopia. In the late nineteenth century, Oromo lands were incorporated into the expanding Ethiopian state. The struggle to protect Oromo identity, language and culture has shaped Oromo history ever since.\n\n## Faith and daily life\n\nThe Oromo practise several religions. Most are Muslim or Christian, while some follow Waaqeffannaa, the indigenous Oromo faith centred on one God, Waaqa. Many Oromo of every faith still use the name Waaqa for God. Traditional values such as respect for elders, hospitality, peace (nagaa) and care for nature remain part of everyday life.\n\n## Why it matters today\n\nOromo culture offers the world more than history. Gadaa's ideas of rotation and accountability, Siiqqee's defence of women's dignity and Irreecha's message of gratitude and peace speak to challenges every society faces. Protecting and passing on this heritage — at home, in school and online — is a responsibility for the new generation.\n\nSources: UNESCO Intangible Cultural Heritage; Encyclopaedia Britannica; Jimma University Journal of Humanities and Social Sciences (Gadaa journal); Addis Standard; The Reporter Ethiopia; AllAfrica; Al Jazeera; University of Pennsylvania African Studies Center.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25",
  "image": "barii-oromo-heritage.jpg",
  "featured": true
 },
 {
  "id": "25-november-one-in-three-women-face-violence-and-the-world-i",
  "kind": "oduu",
  "cat": "hawaasa",
  "title": "25 November: One in Three Women Face Violence — and the World Is Not Moving Fast Enough",
  "summary": "Today, 25 November, is the International Day for the Elimination of Violence against Women. \" According to the World Health Organization (WHO), nearly one in three women worldwide — an estimated 840 million — have experienced physical or sexual violence from a partner, or…",
  "body": "Today, 25 November, is the International Day for the Elimination of Violence against Women. It opens the global 16 Days of Activism, which run until 10 December, Human Rights Day. This year's theme is \"UNiTE to End Violence Against Women and Girls: Ensure justice, protect survivors, end impunity.\"\n\n## The scale of the problem\n\nAccording to the World Health Organization (WHO), nearly one in three women worldwide — an estimated 840 million — have experienced physical or sexual violence from a partner, or sexual violence from someone else, during their lifetime. That figure \n\n> has barely changed since 2000.\n\nIn the past twelve months alone, about 316 million women — 11% of women aged 15 and older — were subjected to physical or sexual violence by an intimate partner. The WHO report also found that violence often begins early: millions of young women aged 15 to 19 are affected each year.\n\n## Prevention is underfunded\n\nExperts say we know what works — education, economic support for women, laws that are enforced, and services for survivors. Yet in 2022 only 0.2% of global development aid went to programmes focused on preventing violence against women, and funding fell further in 2025.\n\n> Violence against women is not a private matter. It harms health, families, communities and whole economies.\n\n## What communities can do\n\nBelieve and support survivors, and help them reach health and legal services. Teach boys and girls about respect and equality from an early age. Ask local leaders, religious leaders and elders to speak out publicly. Know your country's emergency and support numbers.\n\nIf you or someone you know is in danger, contact local emergency services or a trusted health worker.\n\nSources: World Health Organization, UN Women, UN News.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25",
  "image": "barii-25-november.jpg"
 },
 {
  "id": "imf-sees-global-growth-slowing-to-3-1-in-2026-as-inflation-r",
  "kind": "oduu",
  "cat": "dinagdee",
  "title": "IMF Sees Global Growth Slowing to 3.1% in 2026 as Inflation Rises",
  "summary": "The IMF's October 2026 World Economic Outlook raised its forecast slightly but warns of higher prices, rising debt and risks linked to the AI boom.",
  "body": "The International Monetary Fund (IMF) expects the world economy to grow by 3.1% in 2026, down from 3.5% in 2025, before picking up to 3.4% in 2027. The forecast comes from the October 2026 World Economic Outlook, released during the IMF and World Bank Annual Meetings in Bangkok, Thailand, under the title \"Resilience Under Strain, Urgent Choices.\"\n\n## A small upgrade, but a slower year\n\nThe new figure is 0.1 percentage point higher than the IMF's July estimate of 3.0%. Even so, 2026 is set to be a slower year than 2025. The IMF projects growth of 2.1% in advanced economies and 3.7% in emerging market and developing economies, with the latter rebounding to 4.4% in 2027.\n\n## Prices are rising again\n\nInflation is the bigger worry for households. The IMF expects global inflation to climb from 4.1% in 2025 to 4.7% in 2026, before easing to 4.1% in 2027. Higher energy and food prices are the main drivers, and inflation is expected to stay higher in emerging economies than in rich ones.\n\n## Bright spots and risks\n\n> India is again forecast to be the fastest-growing major economy, at about 7%. Heavy investment in artificial intelligence — data centres, chips and power — is supporting growth, especially in the United States, which the IMF sees growing at 2.3% in both 2026 and 2027.\n\n> \"The outlook is highly uneven,\" said Silvana Tenreyro, the IMF's director of research.\n\nThe Fund also warned about rising debt, including borrowing tied to the AI boom, and about energy shocks from conflict in the Middle East.\n\n## What it means for ordinary people\n\nFor families in Africa and other developing regions, higher global inflation usually means more expensive fuel, food and imported goods. Governments face hard choices between protecting the poor and keeping budgets under control.\n\nSources: IMF World Economic Outlook (October 2026), CGTN, Associated Press, Daily Sabah.",
  "author": "Gulaalaa Barii News",
  "date": "2026-11-25",
  "image": "barii-imf-2026.jpg",
  "featured": true
 },

  "body": "The 31st UN Climate Change Conference (COP31) in Antalya, Türkiye, ended on 22 November 2026 without an overarching agreement. Talks ran about two days past their scheduled close, and the proposed \"Antalya pact\" — the summit's main political text — was not adopted.\n\n## What went wrong\n\nReports from the closing session say the final draft of the cover decision was rejected by at least 32 countries, including the European Union, the United Kingdom and several climate-vulnerable nations. The main disagreements were over language on fossil fuels and over finance to help poorer countries adapt to climate impacts. Observers described it as the first major breakdown of a UN climate conference since Copenhagen in 2009.\n\n## What was still agreed\n\nThe summit did not end empty-handed. Negotiators reached agreement on rules for carbon trading under Article 6 of the Paris Agreement, both for deals between countries (Article 6.2) and for the international carbon market (Article 6.4). Outside the formal text, the host country announced more than US$26 billion in green investment partnerships, and a voluntary pledge to raise electricity's share of global energy use to 35% by 2035 drew support from many countries.\n\n## Why it matters for Africa\n\nAfrican countries are among the most exposed to droughts, floods and heat, yet they contribute little to global emissions. Adaptation finance — money to build resilience — was one of the issues left unresolved in Antalya.\n\n> The next round of talks, COP32, is scheduled to take place in Addis Ababa in 2027 — putting Africa's priorities at the centre of the world's climate agenda.\n\n## What to watch\n\nBefore COP32, countries are expected to keep working on adaptation goals, climate finance and their national climate plans. For Ethiopia, hosting the summit will be a major diplomatic test and an opportunity to showcase African solutions.\n\nSources: Carbon Brief, Engineering News-Record, ImpactAlpha, UNFCCC.\n\n##",

      { h: "Maal Gabaafna?", b: "<ul><li><b>Fayyaa:</b> Gorsa fayyaa, ittisa dhukkubaa, nyaata fi qulqullina.</li><li><b>Saayinsii fi Teeknooloojii:</b> Haaromsa, interneetii, AI fi teeknooloojii jireenya jijjiiru.</li><li><b>Hawaasa:</b> Jireenya, rakkoo fi milkaa'ina hawaasaa.</li><li><b>Siyaasa:</b> Odeeffannoo bulchiinsaa, seeraa fi mirga lammummaa — madaalawaan.</li><li><b>Dinagdee:</b> Gabaa, qonna, daldala fi qusannoo.</li><li><b>Aadaa fi Seenaa:</b> Sirna Gadaa, ayyaanota, afaan fi seenaa.</li><li><b>Barnoota:</b> Carraa barnootaa, qajeelfama barattootaa fi maatii.</li><li><b>Ispoortii:</b> Fiigicha, kubbaa miilaa fi milkaa'ina ispoortessitootaa.</li><li><b>Addunyaa:</b> Oduu addunyaa kan jireenya keenya tuqan.</li></ul>" },
      { h: "Maaliif Barii News?", b: "<ul><li><b>Saffisa:</b> Network laafaa (2G/3G) irrattis dafee bana.</li><li><b>Meeshaa hunda irratti:</b> Bilbila xiqqaa, bilbila guddaa, taabileetii fi kompiitara.</li><li><b>Afaanota hedduu:</b> Afaan Oromoo, English, አማርኛ fi afaanota addunyaa 30 ol.</li><li><b>AI:</b> Cuunfaa ofumaan, oduu sagaleedhaan dhaggeeffachuu fi barbaacha smart.</li><li><b>Dubbisuu qulqulluu:</b> Oduun tokko yoo banamu, barreeffama qofatu mul'ata — waan si jeequ hin qabu.</li><li><b>Bilisa:</b> Odeeffannoon keenya nama hundaaf kaffaltii malee.</li></ul>" },
      { h: "Walabummaa fi Iftoomina", b: "<p>Barii News garee siyaasaa, dhaabbata mootummaa ykn daldalaa kamiinuu hin to'atamu. Murtoon gulaallii guutummaatti kan gulaalaa keenyaa ti. Yoo gara fuulduraatti beeksisni ykn deeggarsi jiraate, ifatti “Beeksisa” jedhamee ni mallattoofama; qabiyyee oduu keenya irrattis dhiibbaa hin qabaatu.</p>" },
      { h: "Hiika Asxaa (Logo) Keenyaa", b: "<p>Asxaan keenya ummata Afrikaa bakka bu'a:</p><ul><li>⚫ <b>Gurraacha</b> — ummata Afrikaa, jabina fi of danda'uu.</li><li>🔴 <b>Diimaa</b> — kutannoo, jaalala fi wareegama abbootii keenyaa.</li><li>⚪ <b>Adii</b> — nagaa, dhugaa fi qulqullina.</li><li>☀️ <b>Aduu ba'aa</b> — barii, abdii fi jalqaba haaraa.</li><li>👥 <b>Namoota sadii harka wal qabatan</b> — tokkummaa maatii, hawaasaa fi dhalootaa.</li><li>〰️ <b>Faaya aadaa jalaa</b> — aadaa fi seenaa Afrikaa.</li></ul>" },
      { h: "Hirmaannaa Keessan", b: "<p>Barii News kan ummataa ti. Oduu, suuraa, yaada ykn barreeffama ilaalchaa nuuf erguu dandeessu. Wanti nuuf ergitan hundi dura ni mirkanaa'a, yoo barbaaddan maqaan keessan icciitiin ni eegama. Akkasumas oduu keenya hiriyoota keessaniif qooduun odeeffannoo dhugaa babal'isuu keessatti gahee guddaa qabdu.</p>" },
      { h: "Sirreeffama fi Komii", b: "<p>Nuyis dogoggoruu dandeenya. Oduu keenya keessatti dogoggora yoo argitan, karaa “Nu Qunnamaa” nuuf himaa. Dogoggorri mirkanaa'e battaluma ni sirraa'a, sirreeffamni sunis ifatti ni ibsama.</p>" }
    ],
    policy: [
      "Oduu hunda yoo xiqqaate maddaalee amanamoo lamaan ni mirkaneessina.",
      "Oduu (dhugaa) fi yaada (ilaalcha) addaan baasnee ifatti ibsina.",
      "Yaada garee walmorman hundaa haqaan dhiyeessina.",
      "Jibbaa, garaagarummaa sanyii, amantaa ykn saalaa kan kakaasu hin maxxansinu.",
      "Icciitii dhuunfaa namootaa, keessattuu daa'immanii fi miidhamtootaa, ni eegna.",
      "Suuraa fi barreeffama namoota biroo hayyama malee hin fayyadamnu; madda ni ibsina.",
      "Icciitii madda odeeffannoo keenyaa ni eegna.",
      "Dogoggora yoo raawwanne ifatti fi battaluma sirreessina."
    ],
    close: "Barii News — Odeeffannoo dhugaatiin, barii haaraa! 🌅"

  en: {
    intro: [
      "<b>Barii News</b> is an independent digital news and information outlet, privately founded and run. Our core purpose is to bring the public true, balanced, high-quality and timely information — simply, quickly and free of charge.",
      "We don't just report the news; we aim to build understanding, educate communities and amplify the voice of the people. Barii News is a place where anyone — from a farmer in the countryside to a university student or a global scholar — can find trustworthy information in their own language."
    ],
    sections: [
      { h: "Our Story", b: "<p>Barii News was founded in 2026 as a personal initiative. It was born from a simple but serious problem: our people struggle to find reliable, balanced information prepared in their own language.</p><p>Social media spreads news fast, but it is often hard to tell truth from falsehood. Barii News was created to publish only verified news, grounded in professional journalistic values. We started small, and we are growing together with our readers.</p>" },
      { h: "The Meaning of “Barii”", b: "<p>In Afaan Oromoo, <b>“barii”</b> means <i>dawn</i> — the moment the darkness of night passes and the light of day appears. Dawn is a symbol of hope, new beginnings and new opportunities.</p><p>Just as dawn chases away the dark, we want to replace the darkness of missing information, ignorance and fake news with the light of knowledge and truth. Truth awakens people; an awakened people lights up its own future.</p>" },
      { h: "Our Mission", b: "<p>To build an informed society that knows its rights and makes good decisions, by delivering true, high-quality and useful information in many languages — especially Afaan Oromoo.</p>" },
      { h: "Our Vision", b: "<p>To be Africa's most trusted and widely read digital news source, carrying the voice of African people to the world.</p>" },
      { h: "Our Goals", b: "<ul><li>Deliver true and verified information to the public.</li><li>Counter fake news and misinformation.</li><li>Grow Afaan Oromoo and other African languages in the digital space.</li><li>Raise awareness on health, education, science and technology.</li><li>Amplify community voices — especially rural people, women and youth.</li><li>Pass Africa's culture, history and values proudly to the next generation.</li></ul>" },
      { h: "Our Values", b: "<ul><li><b>Truth:</b> We report only what is verified.</li><li><b>Fairness & Balance:</b> We present all sides fairly; we take no side.</li><li><b>Independence:</b> We take orders from no political, economic or personal power.</li><li><b>Human Dignity:</b> We respect everyone's rights, dignity and privacy.</li><li><b>Accountability:</b> We own our mistakes and correct them openly.</li><li><b>Voice of the People:</b> We give a platform to those rarely heard.</li><li><b>African Pride:</b> We present African knowledge, culture and history with pride.</li></ul>" },
      { h: "What We Cover", b: "<ul><li><b>Health:</b> Health advice, disease prevention, nutrition and hygiene.</li><li><b>Science & Tech:</b> Innovation, the internet, AI and life-changing technology.</li><li><b>Society:</b> Community life, challenges and success stories.</li><li><b>Politics:</b> Governance, law and civic rights — in a balanced way.</li><li><b>Economy:</b> Markets, farming, business and saving.</li><li><b>Culture & History:</b> The Gadaa system, festivals, language and history.</li><li><b>Education:</b> Opportunities and guidance for students and families.</li><li><b>Sports:</b> Athletics, football and our athletes' achievements.</li><li><b>World:</b> Global news that affects our lives.</li></ul>" },
      { h: "Why Barii News?", b: "<ul><li><b>Fast:</b> Opens quickly even on slow 2G/3G networks.</li><li><b>Every device:</b> Small and large phones, tablets and computers.</li><li><b>Many languages:</b> Afaan Oromoo, English, አማርኛ and 30+ world languages.</li><li><b>AI:</b> Automatic summaries, listen-to-article and smart search.</li><li><b>Clean reading:</b> When you open a story, you see only the story — nothing else.</li><li><b>Free:</b> Our information is free for everyone.</li></ul>" },
      { h: "Independence & Transparency", b: "<p>Barii News is not controlled by any political party, government body or company. All editorial decisions belong to our editor. If advertising or sponsorship ever appears, it will be clearly labelled “Advertisement” and will never influence our news content.</p>" },
      { h: "The Meaning of Our Logo", b: "<p>Our logo represents the people of Africa:</p><ul><li>⚫ <b>Black</b> — the African people, strength and self-reliance.</li><li>🔴 <b>Red</b> — commitment, love and the sacrifice of our ancestors.</li><li>⚪ <b>White</b> — peace, truth and purity.</li><li>☀️ <b>The rising sun</b> — dawn, hope and a new beginning.</li><li>👥 <b>Three people holding hands</b> — unity of family, community and generations.</li><li>〰️ <b>The traditional pattern</b> — African culture and heritage.</li></ul>" },
      { h: "Get Involved", b: "<p>Barii News belongs to the people. You can send us news tips, photos, ideas or opinion pieces. Everything you send is verified first, and your identity can stay confidential if you wish. Sharing our stories with friends also helps spread the truth.</p>" },
      { h: "Corrections & Complaints", b: "<p>We can make mistakes too. If you find an error in our reporting, tell us via “Contact Us”. Confirmed errors are corrected promptly, and the correction is stated openly.</p>" }
    ],
    policy: [
      "We verify every story with at least two reliable sources.",
      "We clearly separate news (facts) from opinion.",
      "We fairly present all sides of a disagreement.",
      "We never publish content that incites hatred based on ethnicity, religion or gender.",
      "We protect people's privacy — especially children and victims.",
      "We never use others' photos or writing without permission; we credit our sources.",
      "We protect the confidentiality of our sources.",
      "When we make mistakes, we correct them openly and promptly."
    ],
    close: "Barii News — With true information, a new dawn! 🌅"
  },
  am: {
    intro: [
      "<b>ባሪ ኒውስ (Barii News)</b> በግል የተመሰረተና የሚተዳደር ገለልተኛ የዲጂታል ዜናና መረጃ መድረክ ነው። ዋና ዓላማችን እውነተኛ፣ ሚዛናዊ፣ ጥራት ያለውና ወቅታዊ መረጃን በቀላል፣ በፈጣንና በነፃ ለህዝብ ማድረስ ነው።",
      "ዜና መዘገብ ብቻ ሳይሆን ግንዛቤ መፍጠር፣ ማህበረሰብን ማስተማርና የህዝብን ድምጽ ማሰማት እንፈልጋለን። ባሪ ኒውስ ማንኛውም ሰው — ከገጠር አርሶ አደር እስከ ዩኒቨርሲቲ ተማሪና የዓለም ምሁር — ታማኝ መረጃን በራሱ ቋንቋ የሚያገኝበት ቦታ ነው።"
    ],
    sections: [
      { h: "ታሪካችን", b: "<p>ባሪ ኒውስ በ2026 በግል ተነሳሽነት ተመሰረተ። የተነሳው ከቀላል ግን ትልቅ ችግር ነው፤ ህዝባችን በራሱ ቋንቋ የተዘጋጀ ታማኝና ሚዛናዊ መረጃ ለማግኘት መቸገሩ።</p><p>ማህበራዊ ሚዲያ ዜናን በፍጥነት ያሰራጫል፤ ነገር ግን እውነትን ከሐሰት መለየት ብዙ ጊዜ ከባድ ነው። ባሪ ኒውስ በሙያዊ የጋዜጠኝነት እሴቶች ላይ ተመስርቶ የተረጋገጡ ዜናዎችን ብቻ ለማቅረብ ተፈጠረ። ከትንሽ ጀምረን ከአንባቢዎቻችን ጋር አብረን እያደግን ነው።</p>" },
      { h: "የ«ባሪ» ትርጉም", b: "<p>በኦሮምኛ <b>«ባሪ»</b> ማለት <i>ንጋት</i> ነው — የሌሊቱ ጨለማ አልፎ የቀኑ ብርሃን የሚታይበት ጊዜ። ንጋት የተስፋ፣ የአዲስ ጅማሬና የአዲስ ዕድል ምልክት ነው።</p><p>ንጋት ጨለማን እንደሚያባርር ሁሉ፣ እኛም የመረጃ እጦትን፣ አለማወቅንና የሐሰት ዜናን ጨለማ በእውቀትና በእውነት ብርሃን ለመተካት እንፈልጋለን።</p>" },
      { h: "ተልዕኮአችን", b: "<p>እውነተኛ፣ ጥራት ያለውና ጠቃሚ መረጃን በብዙ ቋንቋዎች — በተለይም በአፋን ኦሮሞ — በማቅረብ መብቱን የሚያውቅና ጥሩ ውሳኔ የሚሰጥ በእውቀት የነቃ ማህበረሰብ መገንባት።</p>" },
      { h: "ራዕያችን", b: "<p>በአፍሪካ እጅግ ታማኝና በብዛት የሚነበብ የዲጂታል ዜና ምንጭ በመሆን የአፍሪካ ህዝቦችን ድምጽ ለዓለም ማሰማት።</p>" },
      { h: "ግቦቻችን", b: "<ul><li>እውነተኛና የተረጋገጠ መረጃ ለህዝብ ማቅረብ።</li><li>የሐሰት ዜናንና የተሳሳተ መረጃን መከላከል።</li><li>አፋን ኦሮሞንና ሌሎች የአፍሪካ ቋንቋዎችን በዲጂታል ዓለም ማሳደግ።</li><li>በጤና፣ በትምህርት፣ በሳይንስና በቴክኖሎጂ ግንዛቤ መፍጠር።</li><li>የማህበረሰብን በተለይም የገጠር ነዋሪዎችን፣ የሴቶችንና የወጣቶችን ድምጽ ማሰማት።</li><li>የአፍሪካን ባህል፣ ታሪክና እሴት በኩራት ለቀጣዩ ትውልድ ማስተላለፍ።</li></ul>" },
      { h: "እሴቶቻችን", b: "<ul><li><b>እውነት፡</b> የተረጋገጠውን ብቻ እንዘግባለን።</li><li><b>ፍትሃዊነትና ሚዛናዊነት፡</b> የሁሉንም ወገን ሀሳብ በፍትሃዊነት እናቀርባለን።</li><li><b>ነፃነት፡</b> ከየትኛውም የፖለቲካ፣ የኢኮኖሚ ወይም የግል ኃይል ትዕዛዝ አንቀበልም።</li><li><b>ሰብአዊ ክብር፡</b> የሁሉንም ሰው መብት፣ ክብርና ግላዊነት እናከብራለን።</li><li><b>ተጠያቂነት፡</b> ለስህተታችን ኃላፊነት ወስደን በግልጽ እናርማለን።</li><li><b>የህዝብ ድምጽ፡</b> ድምጻቸው ለማይሰማ መድረክ እንሰጣለን።</li><li><b>የአፍሪካ ኩራት፡</b> የአፍሪካን እውቀት፣ ባህልና ታሪክ በኩራት እናቀርባለን።</li></ul>" },

function fieldStr(a = SEED[0], k = "") { const v = Reflect.get(a, k); return typeof v === "string" ? v.trim() : ""; }
function videoOf(a = SEED[0]) { return fieldStr(a, "video"); }
function audioOf(a = SEED[0]) { return fieldStr(a, "audio"); }
function galleryOf(a = SEED[0]) {
  const g = Reflect.get(a, "gallery");
  return Array.isArray(g) ? g.filter(function (x) { return typeof x === "string" && x.length > 0; }).map(String) : [""].slice(0, 0);
}
/* Liinkii viidiyoo gara bifa itti ilaalamuutti jijjiiruu */
function videoInfo(u = "") {
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { kind: "frame", src: "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&rel=0", thumb: "https://i.ytimg.com/vi/" + m[1] + "/hqdefault.jpg", tall: /shorts\//.test(u) };
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { kind: "frame", src: "https://player.vimeo.com/video/" + m[1] + "?autoplay=1", thumb: "", tall: false };
  m = u.match(/tiktok\.com\/.*\/video\/(\d+)/);
  if (m) return { kind: "frame", src: "https://www.tiktok.com/embed/v2/" + m[1], thumb: "", tall: true };
  if (/facebook\.com\/|fb\.watch\//.test(u)) return { kind: "frame", src: "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(u) + "&show_text=false&autoplay=true", thumb: "", tall: false };
  if (/^data:video|\.(mp4|webm|ogg|ogv|mov|m4v)(\?|#|$)/i.test(u)) return { kind: "file", src: u, thumb: "", tall: false };
  return { kind: "link", src: u, thumb: "", tall: false };
}
function thumbOf(a = SEED[0]) {
  if (a.image) return a.image;
  const v = videoOf(a);
  if (v) { const t = videoInfo(v).thumb; if (t) return t; }
  const g = galleryOf(a);
  return g.length ? g[0] : "";
}
function cover(a = SEED[0]) {
  const v = videoOf(a), g = galleryOf(a), th = thumbOf(a);
  const badges = (v ? '<span class="bv">▶ ' + T("videos") + "</span>" : "") + (g.length ? '<span class="bg">🖼 ' + g.length + "</span>" : "");
  if (th) return '<div class="cv"><img src="' + esc(th) + '" alt="" loading="lazy" decoding="async">' + badges + "</div>";
  const h = hv(a.id), k = CATK.indexOf(a.cat) > -1 ? a.cat : "addunyaa";
  return '<div class="cv" style="--x:' + (20 + h % 62) + "%;--y:" + (12 + (h >> 4) % 55) + '%" aria-hidden="true"><svg class="ic"><use href="#i-' + k + '"/></svg>' + badges + "</div>";
}
/* Dubbisaa keessatti: viidiyoo, suuraalee fi sagalee */
function mediaHtml(a = SEED[0]) {
  let h = "";
  const v = videoOf(a);
  if (v) {
    const info = videoInfo(v), poster = a.image || info.thumb;
    if (info.kind === "frame") {
      h += '<div class="vbox' + (info.tall ? " tall" : "") + '"><button class="vplay" data-src="' + esc(info.src) + '"' + (poster ? ' style="background-image:url(\'' + esc(poster) + '\')"' : "") + '><i></i><span>' + T("watch") + "</span></button></div>";
    } else if (info.kind === "file") {
      h += '<div class="vbox"><video controls preload="none" playsinline src="' + esc(info.src) + '"' + (poster ? ' poster="' + esc(poster) + '"' : "") + "></video></div>";
    } else {
      h += '<p class="vlink"><a class="pill" target="_blank" rel="noopener" href="' + esc(info.src) + '">▶ ' + T("watch") + "</a></p>";
    }
  } else {
    h += cover(a);
  }
  const au = audioOf(a);
  if (au) h += '<audio class="aud" controls preload="none" src="' + esc(au) + '"></audio>';
  return h;
}
function galleryHtml(a = SEED[0]) {
  const g = galleryOf(a);
  if (!g.length) return "";
  return '<div class="gal">' + g.map(function (src, i) { return '<button data-gi="' + i + '"><img src="' + esc(src) + '" alt="" loading="lazy" decoding="async"></button>'; }).join("") + "</div>";
}
function meta(a = SEED[0]) { return fmtDate(a.date || "") + " · " + minText(readMin(a)); }
function card(a = SEED[0]) {
  return '<a class="card" href="#/oduu/' + esc(a.id) + '">' + cover(a) + '<div class="cb"><span class="tg">' + esc(catName(a.cat)) +
    "</span><h3>" + esc(a.title) + "</h3><p>" + esc(a.summary) + '</p><span class="mt">' + meta(a) + "</span></div></a>";
}
function secHead(t = "", link = "", first = false) {

function norm(s = "") { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’`]/g, "'"); }

/* AI: barbaacha smart — jecha guutuu fi kutaa jechaatiin argata */
function smartSearch(q = "") {
  const toks = norm(q).split(/\s+/).filter(function (t) { return t.length > 1; });
  return ARTS.map(function (a) {
    const ti = norm(a.title), su = norm(a.summary), bo = norm(a.body), ca = norm(catName(a.cat) + " " + pick(CATS_I18N.om, a.cat));
    let s = 0;
    toks.forEach(function (t) {
      const st = t.length > 4 ? t.slice(0, t.length - 2) : t;
      s += ti.indexOf(t) > -1 ? 6 : ti.indexOf(st) > -1 ? 3 : 0;
      s += su.indexOf(t) > -1 ? 3 : su.indexOf(st) > -1 ? 1.5 : 0;
      s += bo.indexOf(t) > -1 ? 1 : bo.indexOf(st) > -1 ? 0.5 : 0;
      s += ca.indexOf(t) > -1 ? 4 : 0;
    });
    return { a: a, s: s };
  }).filter(function (x) { return x.s > 0; })
    .sort(function (x, y) { return y.s - x.s; })
    .map(function (x) { return x.a; });
}

function viewSearch(q = "") {
  setNav("");
  const l = smartSearch(q);
  app.innerHTML = '<div class="ph"><div class="pi"><svg class="ic"><use href="#u-search"/></svg></div><div><h1>“' + esc(q) +
    "”</h1><p>" + l.length + " " + T("results") + "</p></div></div>" +
    (l.length ? '<div class="grid">' + l.map(function (a) { return card(a); }).join("") + "</div>" : emptyBox(T("noRes"), ""));
}

/* ---- AI: Cuunfaa ofumaan (meeshaa kee irratti, interneetii malee) ---- */
const STOP = ["fi", "kan", "ni", "kana", "sana", "irratti", "keessatti", "akka", "yoo", "isaan", "inni", "ishee", "isa", "ykn", "garuu", "immoo", "ammoo",
  "the", "and", "of", "to", "in", "is", "for", "that", "on", "with", "are", "this", "be", "as", "by", "it", "from"];
let LETTERS = /[a-z']+/g;
try { LETTERS = new RegExp("[\\p{L}']+", "gu"); } catch (_e) { /* browser moofaa */ }

function words(s = "") {
  return (s.toLowerCase().match(LETTERS) || [""]).filter(function (w) { return w.length > 2 && STOP.indexOf(w) < 0; });
}
function summarize(text = "", n = 3) {
  const sents = (text.replace(/\s+/g, " ").match(/[^.!?።]+[.!?።]?/g) || [""])
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.split(" ").length >= 5; });
  if (sents.length <= n) return sents;
  const f = new Map([["", 0]]);
  sents.forEach(function (s) { words(s).forEach(function (w) { f.set(w, (f.get(w) || 0) + 1); }); });
  return sents.map(function (s, i) {
    const ws = words(s);
    let sc = ws.reduce(function (sum, w) { return sum + (f.get(w) || 0); }, 0) / Math.pow(ws.length || 1, 0.55);
    if (i === 0) sc *= 1.35;
    return { s: s, i: i, sc: sc };
  }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, n)
    .sort(function (a, b) { return a.i - b.i; })
    .map(function (x) { return x.s; });
}

/* ---- Sagaleen dubbisuu ---- */
let speaking = false;
function stopSpeak() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  speaking = false; updDock();
}
$("#dTts").onclick = function () {
  if (!("speechSynthesis" in window)) { toast(T("noTts")); return; }
  const ss = window.speechSynthesis;
  if (speaking) { stopSpeak(); return; }
  const h1 = rdIn.querySelector("h1");
  const all = [h1 ? h1.textContent || "" : ""].concat(els(".rb h2,.rb p,.rb blockquote", rdIn).map(function (e) { return e.innerText; })).join(". ");
  const parts = all.match(/[^.!?።]+[.!?።]?/g) || [all];
  const code = pick({ om: "om-ET", en: "en-US", am: "am-ET" }, LANG) || LANG;
  const voice = ss.getVoices().find(function (v) { return v.lang.toLowerCase().indexOf(code.slice(0, 2)) === 0; });
  ss.cancel(); speaking = true; updDock();
  parts.forEach(function (p, i) {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = code; u.rate = 0.95;
    if (voice) u.voice = voice;
    if (i === parts.length - 1) u.onend = function () { speaking = false; updDock(); };
    ss.speak(u);
  });
};
function updDock() {
  $("#dAi span").textContent = T("ai");
  $("#dFs span").textContent = T("size");
  $("#dSh span").textContent = T("share");
  $("#dTts span").textContent = speaking ? T("stop") : T("listen");
  $("#dTts").classList.toggle("on", speaking);
}

$("#q").addEventListener("keydown", function (e) {
  const inp = e.target;
  if (e.key !== "Enter" || !(inp instanceof HTMLInputElement)) return;
  doSearch(inp.value); $("#sBar").classList.remove("on"); inp.blur();
});
$("#dQ").addEventListener("keydown", function (e) {
  const inp = e.target;
  if (e.key !== "Enter" || !(inp instanceof HTMLInputElement)) return;
  doSearch(inp.value); closeDrawer(); inp.blur();
});

/* ================= AFAAN JIJJIIRUU (AI hiikkaa) ================= */
let gtLoaded = false, gtBusy = false, gtTarget = "";
function setLang(l = "en") {
  const wasGT = LANG !== SRC;
  LANG = l; storeSet("barii_lang", l);
  if (l === SRC && wasGT && gtLoaded) { clearGT(); location.reload(); return; }
  renderChrome(); baseKey = ""; route();
  if (l !== SRC) loadGT(l);
}
function gtApi() {
  const g = Reflect.get(window, "google");
  return g && g.translate && g.translate.TranslateElement ? g.translate : null;
}
function loadGT(target = "") {
  gtTarget = target;
  if (gtApi()) { applyGT(); return; }
  if (gtBusy) return;
  gtBusy = true;
  toast(T("translating"));
  Reflect.set(window, "bariiGT", function () {
    const api = gtApi();
    if (!api) { toast(T("gtFail")); return; }
    new api.TranslateElement({ autoDisplay: false }, "gt");
    gtLoaded = true; applyGT();
  });
  const s = document.createElement("script");
  s.src = "https://translate.google.com/translate_a/element.js?cb=bariiGT";
  s.async = true;
  s.onerror = function () { gtBusy = false; toast(T("gtFail")); };
  document.head.appendChild(s);
}
function applyGT() {
  let n = 0;
  const tryIt = function () {
    const c = document.querySelector(".goog-te-combo");
    if (c instanceof HTMLSelectElement && c.options.length > 1) { c.value = gtTarget; c.dispatchEvent(new Event("change")); }
    else if (n++ < 60) window.setTimeout(tryIt, 200);
  };
  tryIt();
}
function clearGT() {
  const ex = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
  document.cookie = ex;
  document.cookie = ex + ";domain=" + location.hostname;
  document.cookie = ex + ";domain=." + location.hostname;
}

/* ================= QAAMA WEBSITE ================= */
function socials() {
  return [["Facebook", S.facebook, "f"], ["Telegram", S.telegram, "➤"], ["YouTube", S.youtube, "▶"], ["TikTok", S.tiktok, "♪"], ["X", S.x, "𝕏"]]
    .filter(function (s) { return !!s[1]; });
}
function setNav(k = "") { els("#nav a,#dNav a").forEach(function (a) { a.classList.toggle("on", a.dataset.k === k); }); }
function langName(code = "") { const f = LANGS.find(function (x) { return x[0] === code; }); return f ? f[1] : code; }

function renderChrome() {
  const html = document.documentElement;
  html.lang = SRC; html.dir = RTL.indexOf(LANG) > -1 ? "rtl" : "ltr";
  $("#lCode").textContent = LANG.slice(0, 2).toUpperCase();
  setPh("q", T("searchPh")); setPh("dQ", T("searchPh"));
  const hasMedia = ARTS.some(function (a) { return !!videoOf(a) || galleryOf(a).length > 0; });
  $("#nav").innerHTML = '<a href="#/" data-k="">' + T("home") + "</a>" + (hasMedia ? '<a href="#/viidiyoo" data-k="viidiyoo">▶ ' + T("videos") + "</a>" : "") +
    CATK.map(function (k) { return '<a href="#/kutaa/' + k + '" data-k="' + k + '">' + esc(catName(k)) + "</a>"; }).join("");
  $("#dNav").innerHTML = '<a href="#/" data-k=""><svg class="ic"><use href="#i-home"/></svg>' + T("home") + "</a>" +
    (hasMedia ? '<a href="#/viidiyoo" data-k="viidiyoo"><svg class="ic"><use href="#u-play"/></svg>' + T("videos") + " &amp; " + T("photos") + "</a>" : "") +
    CATK.map(function (k) { return '<a href="#/kutaa/' + k + '" data-k="' + k + '"><svg class="ic"><use href="#i-' + k + '"/></svg>' + esc(catName(k)) + "</a>"; }).join("");
  $("#dLangT").textContent = T("lang");
  const isBuiltin = BUILTIN.indexOf(LANG) > -1;
  $("#dLang").innerHTML = BUILTIN.map(function (l) {
    return '<button data-l="' + l + '" class="notranslate' + (l === LANG ? " on" : "") + '" translate="no">' + langName(l) + "</button>";
  }).join("") + '<button id="dMore" class="' + (isBuiltin ? "" : "on") + '">🌐 ' + (isBuiltin ? T("other") : esc(langName(LANG))) + " …</button>";
  els("#dLang [data-l]").forEach(function (b) { b.onclick = function () { closeDrawer(); setLang(b.dataset.l || SRC); }; });
  $("#dMore").onclick = function () { closeDrawer(); openModal("lang"); };
  $("#themeL").textContent = T("dark");
  const links = [["waa-ee-keenya", T("about")], ["nu-qunnamaa", T("contact")], ["naamusa", T("policy")]];
  const linkHtml = links.map(function (l) { return '<button data-m="' + l[0] + '">' + l[1] + "</button>"; }).join("");
  $("#dSmall").innerHTML = linkHtml;
  $("#fLinks").innerHTML = linkHtml + '<button data-lang="1">🌐 ' + T("lang") + "</button>";
  els("[data-m]").forEach(function (b) { b.onclick = function () { closeDrawer(); location.hash = "#/" + (b.dataset.m || ""); }; });
  $("[data-lang]").onclick = function () { openModal("lang"); };
  $("#fTag").textContent = T("tagline");
  $("#fCats").innerHTML = CATK.map(function (k) { return '<a href="#/kutaa/' + k + '">' + esc(catName(k)) + "</a>"; }).join("");
  $("#soc").innerHTML = socials().map(function (s) { return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener" aria-label="' + s[0] + '">' + s[2] + "</a>"; }).join("");
  $("#copy").textContent = "© " + new Date().getFullYear() + " Barii News. " + T("rights");
  $("#tickL").textContent = T("breaking");
  const tk = ARTS.slice(0, 6);
  $("#tick").style.display = tk.length ? "" : "none";
  $("#tickT").innerHTML = tk.map(function (a) { return '<a href="#/oduu/' + esc(a.id) + '">' + esc(a.title) + "</a>"; }).join("");
  $("#off").textContent = T("offline");
  updDock();
}

/* ================= VIIDIYOO TAPHACHIISUU fi SUURAALEE ================= */
let lbList = [""].slice(0, 0), lbIdx = 0;
function lbShow(i = 0) {
  if (!lbList.length) return;
  lbIdx = (i + lbList.length) % lbList.length;
  const img = document.getElementById("lbI");
  if (img instanceof HTMLImageElement) img.src = lbList[lbIdx];
  $("#lbC").textContent = (lbIdx + 1) + " / " + lbList.length;
  $("#lbP").style.display = $("#lbN").style.display = lbList.length > 1 ? "" : "none";
  $("#lbx").classList.add("on");
}
function lbClose() { $("#lbx").classList.remove("on"); }
$("#lbX").onclick = lbClose;
$("#lbP").onclick = function () { lbShow(lbIdx - 1); };
$("#lbN").onclick = function () { lbShow(lbIdx + 1); };
$("#lbx").addEventListener("click", function (e) { if (e.target === $("#lbx")) lbClose(); });
rdIn.addEventListener("click", function (e) {
  const el = e.target instanceof Element ? e.target : null;
  if (!el) return;
  const play = el.closest(".vplay");
  if (play instanceof HTMLElement && play.parentElement) {
    const f = document.createElement("iframe");
    f.src = play.dataset.src || "";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    f.title = T("watch");
    play.parentElement.replaceChild(f, play);
    return;
  }
  const gb = el.closest("[data-gi]");
  if (gb instanceof HTMLElement && curArt) { lbList = galleryOf(curArt); lbShow(Number(gb.dataset.gi || 0)); }
});

/* ================= KARAA (ROUTER) ================= */
let baseKey = "";
let lastBase = "#/", navCount = -1;
const MODALS = ["waa-ee-keenya", "nu-qunnamaa", "naamusa"];

function route() {
  navCount++;
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const parts = h.split("/"), p0 = parts[0] || "", arg = parts.slice(1).join("/");
  if (p0 === "oduu") { closeModal(); if (!baseKey) renderBase("", ""); openReader(arg); return; }
  closeReader();
  if (MODALS.indexOf(p0) > -1) { if (!baseKey) renderBase("", ""); openModal(p0); return; }
  closeModal();
  if (p0 + "|" + arg !== baseKey) { renderBase(p0, arg); window.scrollTo(0, 0); }
  lastBase = location.hash || "#/";
}
function renderBase(p0 = "", arg = "") {
  baseKey = p0 + "|" + arg; document.title = "Barii News";
  if (!p0) viewHome();
  else if (p0 === "kutaa") viewCat(arg);
  else if (p0 === "viidiyoo") viewMedia();
  else if (p0 === "barbaadi") viewSearch(arg);
  else view404();
}

/* ================= JALQABUU ================= */
let theme = storeGet("barii_theme");
if (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
document.documentElement.dataset.theme = theme || "light";
$("#themeT").onclick = function () {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; storeSet("barii_theme", t);
};
$("#lBtn").onclick = function () { openModal("lang"); };
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if ($("#lbx").classList.contains("on")) lbClose();
  else if (mdl.classList.contains("on")) closeModalUI();
  else if (drw.classList.contains("on")) closeDrawer();
  else if (rd.classList.contains("on")) leaveReader();
});
function net() { $("#off").style.display = navigator.onLine ? "none" : "block"; }
window.addEventListener("online", net);
window.addEventListener("offline", net);
net();
if (PREVIEW) document.body.insertAdjacentHTML("afterbegin", '<div class="prev">👁️ Ilaalcha duraa — namoonni biroo hin argan · <a href="admin.html" onclick="if(document.referrer){history.back();return false;}">← Gara Admin deebi\'i</a></div>');

renderChrome();
window.addEventListener("hashchange", route);
route();
if (LANG !== SRC) loadGT(LANG);
/* sw.js amma hin barbaachisu: kan duraan galmaa'e yoo jiraate ni haqama */
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () { /* hin jiru */ });
}
})();
</script>
