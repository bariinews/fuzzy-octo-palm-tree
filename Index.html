<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barii News</title>
<meta name="description" content="Barii News — Odeeffannoo dhugaa: fayyaa, saayinsii fi teeknooloojii, hawaasa, siyaasa, dinagdee, aadaa, barnoota, ispoortii fi addunyaa.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Barii News">
<meta property="og:description" content="Odeeffannoo Dhugaa, Barii Haaraa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%230a0a0a'/%3E%3Ccircle cx='32' cy='35' r='13' fill='%23d7141a'/%3E%3Cpath d='M4 35h56v12H4z' fill='%230a0a0a'/%3E%3Ccircle cx='32' cy='36' r='4' fill='%23fff'/%3E%3Cpath d='M25 50c0-7 3-10 7-10s7 3 7 10z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ================= BARII NEWS — ⚫ 🔴 ⚪ ================= */
:root{--k:#0a0a0a;--r:#d7141a;--bg:#fff;--bg2:#f4f4f4;--tx:#111;--mut:#676767;--ln:#e6e6e6;
--serif:Georgia,"Times New Roman","Noto Serif","Noto Serif Ethiopic",Nyala,serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic",Nyala,Arial,sans-serif;
--max:1240px;--rad:6px}
[data-theme=dark]{--bg:#0b0b0b;--bg2:#161616;--tx:#f1f1f1;--mut:#a3a3a3;--ln:#252525}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;top:0!important;position:static!important}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{max-width:100%;display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--r);outline-offset:2px}

/* Google Translate UI dhoksuu */
#gt,.goog-te-banner-frame,.skiptranslate>iframe,iframe.skiptranslate,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
font{background:transparent!important;box-shadow:none!important}

/* -------- Mata (Header) -------- */
.hd{position:sticky;top:0;z-index:40;background:var(--k);color:#fff}
.hd-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;height:60px}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:50%;cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:22px;height:22px}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
[dir=rtl] .logo{margin-right:0;margin-left:auto}
.logo svg{width:40px;height:40px;flex:none}
.wm{font:900 21px/1 var(--sans);letter-spacing:1.5px;white-space:nowrap}
.wm b{color:var(--r);font-weight:900}
.lb{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:transparent;color:#fff;font:700 12.5px var(--sans);cursor:pointer;text-transform:uppercase;flex:none}
.lb svg{width:16px;height:16px}
.lb:hover{border-color:#fff}
.sbar{display:none;background:var(--k);padding:0 12px 12px}
.sbar.on{display:block}
.sbar input{display:block;max-width:760px;margin:0 auto;width:100%;height:46px;border-radius:999px;border:0;padding:0 20px;font:16px var(--sans);background:#fff;color:#111}
.nav{background:var(--bg);border-bottom:1px solid var(--ln);position:sticky;top:60px;z-index:39}
.nav-in{max-width:var(--max);margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:12px 12px 10px;font:700 13.5px var(--sans);border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--r)}
.nav a.on{border-color:var(--r);color:var(--r)}
@media(min-width:1024px){.hd-in{height:74px;padding:0 16px}.nav{top:74px}.logo svg{width:50px;height:50px}.wm{font-size:28px}.nav-in{justify-content:center}}

.tick{background:var(--r);color:#fff;font:600 14px var(--sans)}
.tick-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 12px;height:38px}
.tick-l{background:var(--k);padding:3px 10px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;flex:none}
.tick-t{overflow:hidden;white-space:nowrap;flex:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tick-t span{display:inline-block;padding-left:100%;animation:tk 55s linear infinite}
.tick-t a{margin-right:52px}
.tick-t a::before{content:"";display:inline-block;width:6px;height:6px;background:#fff;margin-right:9px;vertical-align:2px}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tick-t span{animation:none;padding-left:0}}
.off{display:none;background:#222;color:#fff;text-align:center;font:13px var(--sans);padding:6px}

/* -------- Qabiyyee -------- */
main{max-width:var(--max);margin:0 auto;padding:18px 14px 40px;min-height:62vh}
.dl{font:700 11.5px var(--sans);text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);margin:0 0 14px}
.top{display:grid;gap:24px}
@media(min-width:900px){.top{grid-template-columns:1.8fr 1fr;gap:30px}}
.lead{position:relative;display:block;border-radius:var(--rad);overflow:hidden;background:var(--k);color:#fff;min-height:380px}
@media(min-width:900px){.lead{min-height:500px}}
.lead .cv{position:absolute;inset:0;aspect-ratio:auto;height:100%;border-radius:0}
.lead .cv{align-items:start;padding-top:9%}
.lead .cv svg{width:22%;max-width:110px}
.lead-t{position:absolute;left:0;right:0;bottom:0;padding:90px 20px 22px;background:linear-gradient(transparent,rgba(0,0,0,.94) 62%)}
.lead h2{font:700 clamp(25px,3.5vw,40px)/1.13 var(--serif);margin:10px 0 8px;letter-spacing:-.3px}
.lead p{color:#d6d6d6;margin:0 0 10px;font-size:15.5px;max-width:640px}
.lead .mt{color:#aaa}
.lead:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.kick{display:inline-block;background:var(--r);color:#fff;font:800 10.5px var(--sans);letter-spacing:1.4px;text-transform:uppercase;padding:4px 8px}
.nl{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--ln)}
.nl:last-child{border:0}
.num{font:700 30px/1 var(--serif);color:var(--r)}
.nl h3{font:700 17px/1.3 var(--serif);margin:3px 0 4px}
.nl:hover h3{color:var(--r)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:44px 0 16px;padding-top:10px;border-top:3px solid var(--tx)}
.sh.s0{margin-top:0}
.sh h2{font:800 14px var(--sans);text-transform:uppercase;letter-spacing:1.6px;display:flex;align-items:center;gap:10px;margin:0}
.sh h2::before{content:"";width:11px;height:11px;background:var(--r);flex:none}
.sh a{font:700 12.5px var(--sans);color:var(--r);white-space:nowrap}
.grid{display:grid;gap:26px 22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:flex;flex-direction:column;gap:10px}
.card .cv{border-radius:var(--rad)}
.cb{display:flex;flex-direction:column;gap:5px;min-width:0}
.card h3{font:700 19px/1.28 var(--serif);margin:0}
.card:hover h3{color:var(--r)}
.card p{color:var(--mut);font-size:14.5px;margin:0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tg{font:800 10.5px var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--r)}
.mt{font:12.5px var(--sans);color:var(--mut)}
@media(max-width:640px){
 .grid{grid-template-columns:1fr;gap:0}
 .card{flex-direction:row-reverse;gap:12px;padding:15px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
 .card .cv{width:104px;flex:none;aspect-ratio:1}
 .card .cv svg{width:44%}
 .card h3{font-size:17px}
 .card p{display:none}
 .cb{flex:1}
}
.cv{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--k);display:grid;place-items:center;color:#fff}
.cv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,70%) var(--y,30%),rgba(215,20,26,.92),rgba(215,20,26,0) 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 1px,transparent 1px 12px)}
.cv svg{position:relative;width:30%;max-width:120px;height:auto;aspect-ratio:1;stroke-width:1.15}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.more{display:flex;margin:28px auto 0;height:44px;padding:0 26px;align-items:center;border:2px solid var(--tx);background:transparent;color:var(--tx);font:800 12.5px var(--sans);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.more:hover{background:var(--tx);color:var(--bg)}
.ph{display:flex;align-items:center;gap:14px;margin:6px 0 24px;padding-bottom:18px;border-bottom:3px solid var(--tx)}
.ph .pi{width:56px;height:56px;background:var(--r);color:#fff;display:grid;place-items:center;flex:none}
.ph .pi svg{width:30px;height:30px}
.ph h1{font:700 clamp(26px,4vw,40px)/1.1 var(--serif);margin:0}
.ph p{margin:4px 0 0;color:var(--mut);font-size:14px}
.empty{text-align:center;padding:70px 14px;color:var(--mut)}
.empty svg{width:64px;height:64px;color:var(--r);margin-bottom:10px}
.empty h2{font:700 24px var(--serif);color:var(--tx);margin:0 0 6px}

/* -------- Miilla (Footer) -------- */
footer{background:var(--k);color:#a9a9a9;margin-top:30px}
.ft{max-width:var(--max);margin:0 auto;padding:28px 14px 20px}
.ft-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid #222}
.ft-brand{display:flex;align-items:center;gap:10px;color:#fff}
.ft-brand svg{width:40px;height:40px}
.ft-brand small{display:block;color:#999;font-size:12px;margin-top:2px}
.soc{display:flex;gap:8px}
.soc a{width:34px;height:34px;border:1px solid #333;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px var(--sans)}
.soc a:hover{background:var(--r);border-color:var(--r)}
.ft-cats{display:flex;flex-wrap:wrap;gap:6px 18px;padding:16px 0;border-bottom:1px solid #222;font:700 13px var(--sans)}
.ft-cats a{color:#e6e6e6}
.ft-cats a:hover{color:var(--r)}
.ft-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-top:14px;font-size:12px}
.ft-links{display:flex;flex-wrap:wrap;gap:4px 16px}
.ft-links button{background:none;border:0;color:#a9a9a9;font:12px var(--sans);cursor:pointer;padding:2px 0}
.ft-links button:hover{color:#fff}

/* -------- Menu (Drawer) -------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--k);color:#fff;z-index:71;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.drw.on{transform:none}
.drw-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 16px;border-bottom:1px solid #222;min-height:60px}
.drw-h .wm{font-size:19px}
.drw-q{padding:14px 16px 6px}
.drw-q input{width:100%;height:42px;border-radius:999px;border:1px solid #333;background:#151515;color:#fff;padding:0 16px;font:15px var(--sans)}
.drw nav{padding:6px 0}
.drw nav a{display:flex;align-items:center;gap:14px;padding:12px 18px;font:600 15px var(--sans);border-left:3px solid transparent}
.drw nav a:hover{background:#141414}
.drw nav a.on{border-color:var(--r);background:#151515;color:#fff}
.drw nav svg{width:20px;height:20px;opacity:.85}
.drw-s{padding:16px;border-top:1px solid #222}
.drw-s h6{font:800 10.5px var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:#8a8a8a;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 13px;border-radius:999px;border:1px solid #333;background:transparent;color:#fff;font:600 13px var(--sans);cursor:pointer}
.chips button.on{background:var(--r);border-color:var(--r)}
.drw-small{display:flex;flex-wrap:wrap;gap:6px 16px}
.drw-small button{background:none;border:0;color:#9a9a9a;font:13px var(--sans);cursor:pointer;padding:2px 0}
.drw-small button:hover{color:#fff}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#fff;font:600 14px var(--sans);cursor:pointer;padding:0}
.tgl i{width:42px;height:24px;border-radius:999px;background:#333;position:relative;transition:.2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
[data-theme=dark] .tgl i{background:var(--r)}
[data-theme=dark] .tgl i::after{left:21px}

/* -------- Modal xiqqaa (Waa'ee Keenya, Nu Qunnamaa, Afaan) -------- */
.mdl{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.mdl.on{display:flex}
.mdl-b{position:relative;background:var(--bg);color:var(--tx);width:100%;max-width:600px;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom));animation:up .25s ease;border-top:4px solid var(--r)}
@media(min-width:700px){.mdl{align-items:center}.mdl-b{border-radius:10px}}
.mdl-x{position:absolute;top:8px;right:8px;color:var(--tx)}
[dir=rtl] .mdl-x{right:auto;left:8px}
.mdl-x:hover{background:var(--bg2)}
.mdl h2{font:700 25px/1.2 var(--serif);margin:0 40px 4px 0}
.mdl .sub{color:var(--mut);margin:0 0 6px;font-size:14px}
.mdl h3{font:800 11.5px var(--sans);text-transform:uppercase;letter-spacing:1.4px;color:var(--r);margin:22px 0 6px}
.mdl p,.mdl li{font-size:15px;line-height:1.65;margin:0 0 8px}
.mdl ul{padding-left:18px;margin:0}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals span{border:1px solid var(--ln);padding:5px 11px;border-radius:999px;font:600 13px var(--sans)}
.clist a,.clist div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-weight:600}
.clist i{width:36px;height:36px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px;flex:none}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.langs button{padding:11px 13px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;font:600 14px var(--sans);text-align:start;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.langs button:hover{border-color:var(--tx)}
.langs button.on{border-color:var(--r);background:var(--r);color:#fff}
.langs small{font-size:10px;opacity:.7;text-transform:uppercase}
.acc{margin-top:14px;border-top:1px solid var(--ln)}
.acc details{border-bottom:1px solid var(--ln)}
.acc summary{list-style:none;cursor:pointer;padding:14px 30px 14px 0;font:700 16px var(--serif);position:relative}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";position:absolute;right:4px;top:10px;font:400 24px var(--sans);color:var(--r)}
.acc details[open] summary::after{content:"\2212"}
.acc details>div{padding:0 0 12px}
.aclose{text-align:center;font:700 17px var(--serif);margin:22px 0 12px!important}
.mlogo{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.mlogo svg{width:64px;height:64px;flex:none}

/* -------- Dubbisaa (Reader) — oduu qofa -------- */
.rd{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none}
.rd.on{display:block;animation:up .28s ease}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.rd-p{position:fixed;top:0;left:0;height:3px;background:var(--r);width:0;z-index:93}
.rd-x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:93;width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,10,10,.85);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
[dir=rtl] .rd-x{right:auto;left:12px}
.rd-x svg{width:22px;height:22px}
.rd-in{max-width:720px;margin:0 auto;padding:66px 20px 150px;font-size:var(--fs,19px)}
.rd h1{font:700 clamp(28px,5.6vw,46px)/1.13 var(--serif);margin:14px 0 14px;letter-spacing:-.4px}
.rd .rs{font:400 1.07em/1.55 var(--serif);color:var(--mut);margin:0 0 18px}
.rd .rm{font:13px var(--sans);color:var(--mut);padding:12px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:4px 16px}
.rd .rm b{color:var(--tx)}
.rd .cv{margin:24px 0;border-radius:var(--rad)}
.rb{font-family:var(--serif);line-height:1.8}
.rb p{margin:0 0 1.15em}
.rb h2{font:700 1.25em/1.3 var(--serif);margin:1.6em 0 .5em}
.rb blockquote{margin:1.6em 0;padding:2px 0 2px 20px;border-left:4px solid var(--r);font-size:1.14em;font-style:italic}
.rb>p:first-of-type::first-letter{float:left;font-size:3.5em;line-height:.82;padding:.06em .1em 0 0;color:var(--r);font-weight:700}
.ai{background:var(--bg2);border-left:4px solid var(--r);padding:14px 16px;margin:22px 0;border-radius:0 8px 8px 0;font:15.5px/1.6 var(--sans)}
.ai b{display:flex;gap:6px;align-items:center;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--r);margin-bottom:8px}
.ai b svg{width:16px;height:16px}
.ai ul{margin:0;padding-left:18px}
.ai li{margin:0 0 6px}
.ai small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.rend{margin-top:40px;padding-top:18px;border-top:3px solid var(--tx);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:700 13px var(--sans)}
.rend>span{margin-right:4px;text-transform:uppercase;letter-spacing:1px;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:700 13px var(--sans);cursor:pointer}
.pill:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:93;display:flex;gap:2px;background:rgba(10,10,10,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .25s,opacity .25s}
.dock.hide{transform:translate(-50%,110px);opacity:0}
.dock button{display:flex;align-items:center;gap:7px;height:42px;padding:0 15px;border:0;border-radius:999px;background:transparent;color:#fff;font:700 13px var(--sans);cursor:pointer;white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.12)}
.dock button.on{background:var(--r)}
.dock svg{width:18px;height:18px}
@media(max-width:480px){.dock button span{display:none}.dock button{padding:0 15px}}

/* -------- Miidiyaa: viidiyoo, suuraalee, sagalee -------- */
.vbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--rad);overflow:hidden;margin:24px 0}
.vbox.tall{aspect-ratio:9/16;max-width:360px;margin-left:auto;margin-right:auto}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vplay{position:absolute;inset:0;width:100%;border:0;padding:0;cursor:pointer;background:#111 center/cover no-repeat;display:grid;place-items:center}
.vplay::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}
.vplay i{position:relative;width:74px;height:74px;border-radius:50%;background:var(--r);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.vplay i::after{content:"";border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:7px}
.vplay span{position:absolute;left:14px;bottom:12px;color:#fff;font:700 13px var(--sans);letter-spacing:.5px}
.vlink{display:flex;align-items:center;gap:10px;margin:24px 0}
.bv{position:absolute;left:8px;bottom:8px;z-index:1;background:var(--r);color:#fff;font:800 10.5px var(--sans);letter-spacing:1px;padding:4px 8px;border-radius:4px}
.bg{position:absolute;right:8px;bottom:8px;z-index:1;background:rgba(0,0,0,.75);color:#fff;font:700 11px var(--sans);padding:4px 8px;border-radius:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:24px 0}
.gal button{padding:0;border:0;aspect-ratio:1;overflow:hidden;border-radius:6px;cursor:zoom-in;background:#111}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.gal button:hover img{transform:scale(1.05)}
.aud{width:100%;margin:20px 0}
.lbx{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:16px}
.lbx.on{display:flex}
.lbx img{max-width:100%;max-height:86vh;border-radius:4px}
.lbx .ib{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);color:#fff}
.lbx .nx,.lbx .pv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:26px;cursor:pointer}
.lbx .nx{right:10px}.lbx .pv{left:10px}
.lbx small{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ccc;font:13px var(--sans)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--k);color:#fff;padding:10px 18px;border-radius:999px;font:600 14px var(--sans);opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;border:1px solid #333;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.prev{background:var(--r);color:#fff;text-align:center;font:700 12.5px var(--sans);padding:8px}
.prev a{color:#fff;text-decoration:underline;white-space:nowrap}
@media print{.hd,.nav,.tick,footer,.dock,.rd-x{display:none!important}.rd{position:static;display:block}}

/* ================= OGEEFFANNOO JALQABAA (fakkeenya) ================= */
const SEED = [
 {id:"bishaan-qulqulluu",cat:"fayyaa",featured:true,date:"2026-11-24",author:"Gulaalaa Barii News",image:"",
  title:"Bishaan Qulqulluu: Furtuu Fayyaa Maatii",
  summary:"Dhukkubni hedduun bishaan faalame irraa dhufa. Mana keessatti bishaan qulqulleessuuf maloota salphaa fi gatii xiqqaa qaban beeki.",
  body:"Bishaan qulqulluun jireenya fayyaa qabuuf bu'uura. Dhukkuboonni akka garaa kaasaa, kolaraa fi tifooyidii yeroo baay'ee bishaan faalame dhuguu irraa ka'u.\n\n## Maloota Salphaa\n\nBishaan danfisuu: Bishaan daqiiqaa tokkoof hanga danfutti danfisuun jermiiwwan baay'ee ajjeesa. Erga qabbanaa'ee booda meeshaa qulqulluu fi cufamaa keessa kaa'i.\n\nKeemikaala qulqulleessaa: Kiloriinii ykn kiniinii qulqulleessaa bishaanii qajeelfama irratti barreeffame hordofuun fayyadami.\n\nAduu fayyadamuu: Qaruuraa pilaastikii ifaa keessa bishaan guutii sa'aatii jahaaf aduu cimaa keessa kaa'uun jermiiwwan hir'isuu danda'a.\n\n> Harka dhiqachuun, keessattuu nyaata dura fi mana fincaanii booda, dhukkuboota hedduu ittisa.\n\nMaatiin hundi bishaan dhugaatii fi kan biroo adda baasee kuusuu qaba. Meeshaan bishaan kuusu yeroo yeroon dhiqamuu fi cufamee turuu qaba."},
 {id:"bilbila-harkaa-dinagdee",cat:"saayinsii",featured:true,date:"2026-11-23",author:"Gulaalaa Barii News",image:"",
  title:"Bilbila Harkaa fi Jijjiirama Jireenya Baadiyyaa",
  summary:"Maallaqa bilbilaan erguu irraa kaasee hanga odeeffannoo gabaa argachuutti, teeknooloojiin bilbilaa jireenya qonnaan bultootaa jijjiiraa jira.",
  body:"Yeroo ammaa Afrikaa keessatti namoonni miliyoona hedduun bilbila harkaa fayyadamu. Kun teeknooloojii qofa osoo hin taane, meeshaa dinagdee fi barnootaa ta'eera.\n\n## Maallaqa Bilbilaan\n\nTajaajilli maallaqa bilbilaan erguu fi fudhachuu namoota baankii irraa fagoo jiraataniif carraa haaraa banee jira. Qonnaan bultoonni gatii oomisha isaanii battaluma argachuu danda'u.\n\n## Odeeffannoo Gabaa fi Qilleensaa\n\nErgaa gabaabaa fi appiiwwan salphaan odeeffannoo gatii gabaa fi tilmaama qilleensaa kennu. Kun murtoo qonnaa fooyyessa.\n\n## Qormaata\n\nHaa ta'u malee, gatiin daataa, humna ibsaa dhabuu fi beekumsi dijitaalaa gahaa dhabuun ammallee rakkoo dha. Mootummaa, dhaabbilee fi hawaasni walii galtee uumuu qabu."},
 {id:"busaa-ittisuu",cat:"fayyaa",date:"2026-11-22",author:"Gulaalaa Barii News",image:"",
  title:"Busaa (Malaariyaa) Ittisuuf Tarkaanfiiwwan Salphaa",
  summary:"Busaan Afrikaa keessatti dhukkuboota lubbuu namaa galaafatan keessaa tokko. Maatii kee akkamitti eegda?",
  body:"Busaan bookee dhaan daddarba. Keessattuu daa'imman fi dubartoonni ulfaa'oon miidhamuuf saaxilamoo dha.\n\n## Akkamitti Ittisna?\n\nAgobara qoricha qabu halkan hunda keessa rafuu. Bishaan dhaabbataa naannoo manaa jiru balleessuu, sababni isaas bookeen achitti hormaata. Uffata harka dheeraa uffachuu, keessattuu galgala.\n\n## Mallattoolee\n\nHo'a qaamaa, dhiphina, mataa dhukkubbii fi qorraa yoo argite, battaluma buufata fayyaa dhaqi. Busaan dafee yoo yaalame ni fayya."},
 {id:"odeeffannoo-sobaa",cat:"saayinsii",date:"2026-11-21",author:"Gulaalaa Barii News",image:"",
  title:"Odeeffannoo Sobaa Interneetii Irratti Akkamitti Adda Baafna?",
  summary:"Miidiyaa hawaasaa irratti oduun sobaa saffisaan babal'ata. Qajeelfamoota salphaa shan dhugaa fi soba addaan baasuuf si gargaaran.",
  body:"Oduun sobaa yeroo baay'ee miira namaa kakaasuuf qophaa'a. Kanaaf qoodaa gochuu kee dura yeroo muraasa fudhadhu.\n\n## Qajeelfamoota Shan\n\nMadda ilaali: Eenyutu barreesse? Dhaabbata beekamaa dha? Guyyaa ilaali: Oduun moofaan akka haaraatti deebi'ee dhiyaata.\n\nMadda biraa irratti mirkaneessi: Oduun guddaan yoo dhugaa ta'e, miidiyaa hedduu irratti argama. Suuraa qori: Suuraan bakka biraa fi yeroo biraa irraa fudhatamee fayyadamuu danda'a.\n\nMiira kee to'adhu: Oduun si aarsu ykn si sodaachisu yeroo baay'ee dogoggora qabaachuu danda'a.\n\n> Qoodaa gochuu dura mirkaneessi — kun itti gaafatamummaa lammummaa ammayyaati."},
 {id:"sirna-gadaa",cat:"aadaa",featured:true,date:"2026-11-20",author:"Gulaalaa Barii News",image:"",
  title:"Sirna Gadaa: Dhaala Dimokraasii Afrikaa",
  summary:"Sirni Gadaa sirna bulchiinsa hawaasaa Oromoo kan bara dheeraa ture yoo ta'u, bara 2016 UNESCO'n dhaala aadaa addunyaa ta'ee galmaa'eera.",
  body:"Sirni Gadaa sirna siyaasaa, dinagdee fi hawaasummaa uummata Oromoo kan dhaloota dhalootaan darbaa dhufe dha.\n\n## Bu'uura Sirnichaa\n\nSirnichi kutaa umurii irratti hundaa'a. Aangoon waggaa saddeet saddeetiin harka wal jijjiira. Kun aangoon nama tokko harka akka hin turre ittisa.\n\n## Duudhaalee Gurguddoo\n\nWalqixxummaa, mariin murteessuu, nagaa fi kabaja uumamaaf qabaachuun duudhaalee sirnichaa keessaa muraasa.\n\n## Beekamtii Addunyaa\n\nBara 2016 UNESCO'n Sirna Gadaa dhaala aadaa addunyaa hin tuqamne keessatti galmeesseera. Kun boonsaa Oromoo qofa osoo hin taane, boonsaa Afrikaa guutuu ti."},
 {id:"hirmaannaa-lammiilee",cat:"siyaasa",date:"2026-11-19",author:"Gulaalaa Barii News",image:"",
  title:"Hirmaannaan Lammiilee Bulchiinsa Gaarii Keessatti Maaliif Barbaachisa?",
  summary:"Bulchiinsi gaariin mootummaa qofaan hin ijaaramu. Lammiileen beekumsaan hirmaachuun murtoo isaan tuqu irratti sagalee qabaachuu qabu.",
  body:"Hirmaannaan lammiilee yeroo filannoo sagalee kennuu qofa miti. Marii hawaasaa irratti hirmaachuu, gaaffii mirgaa nagaan dhiyeessuu fi tajaajila ummataa hordofuu of keessaa qaba.\n\n## Mirgaa fi Dirqama\n\nLammiin kamiyyuu heera biyyaa fi seera beekuun mirga isaa kabachiisuu fi dirqama isaa bahuu danda'a.\n\n## Odeeffannoo Dhugaa\n\nMurtoo gaarii kennuuf odeeffannoo madaalawaa fi dhugaa argachuun murteessaa dha. Barii News yaada garee hundaa haqaan dhiyeessuuf kutannoo qaba.\n\n> Sagaleen kee ni barbaachisa — beekumsaan, nagaan fi kabajaan itti fayyadami."},
 {id:"irreechaa",cat:"aadaa",date:"2026-11-18",author:"Gulaalaa Barii News",image:"",
  title:"Irreechaa: Ayyaana Galataa fi Nagaa",
  summary:"Irreechi ayyaana Waaqaaf galata itti galchan, nagaa fi araara itti labsan yoo ta'u, aadaa Oromoo keessatti iddoo guddaa qaba.",
  body:"Irreechi ayyaana waggaa waggaan kabajamu dha. Irreecha Malkaa fi Irreecha Tulluu jedhamuun bakka lamatti qoodama.\n\n## Hiika Ayyaanichaa\n\nIrreecha Birraa irratti, gannaa dukkanaa'aa fi bishaan baay'ee irraa nagaan ce'uu isaaniif, uummanni Waaqaaf galata galcha. Marga jiidhaa fi daraaraa qabatanii gara malkaatti deemu.\n\n## Nagaa fi Tokkummaa\n\nAyyaanichi bakka itti namoonni wal araarsan, wal eebbisan fi tokkummaa isaanii itti ibsatan dha. Uffata aadaa, sirba fi weedduun ayyaanicha miidhagsu."},
 {id:"qusannoo-xixiqqaa",cat:"dinagdee",date:"2026-11-17",author:"Gulaalaa Barii News",image:"",
  title:"Qusannoo Xixiqqaa: Karaa Dinagdee Maatii Jabeessu",
  summary:"Galiin xiqqaa ta'us, qusannoo yeroo yeroon gootuun gara fuulduraatti jijjiirama guddaa fiduu danda'a.",

      { h: "Our Mission", b: "<p>To build an informed society that knows its rights and makes good decisions, by delivering true, high-quality and useful information in many languages — especially Afaan Oromoo.</p>" },
      { h: "Our Vision", b: "<p>To be Africa's most trusted and widely read digital news source, carrying the voice of African people to the world.</p>" },
      { h: "Our Goals", b: "<ul><li>Deliver true and verified information to the public.</li><li>Counter fake news and misinformation.</li><li>Grow Afaan Oromoo and other African languages in the digital space.</li><li>Raise awareness on health, education, science and technology.</li><li>Amplify community voices — especially rural people, women and youth.</li><li>Pass Africa's culture, history and values proudly to the next generation.</li></ul>" },
      { h: "Our Values", b: "<ul><li><b>Truth:</b> We report only what is verified.</li><li><b>Fairness & Balance:</b> We present all sides fairly; we take no side.</li><li><b>Independence:</b> We take orders from no political, economic or personal power.</li><li><b>Human Dignity:</b> We respect everyone's rights, dignity and privacy.</li><li><b>Accountability:</b> We own our mistakes and correct them openly.</li><li><b>Voice of the People:</b> We give a platform to those rarely heard.</li><li><b>African Pride:</b> We present African knowledge, culture and history with pride.</li></ul>" },
      { h: "What We Cover", b: "<ul><li><b>Health:</b> Health advice, disease prevention, nutrition and hygiene.</li><li><b>Science & Tech:</b> Innovation, the internet, AI and life-changing technology.</li><li><b>Society:</b> Community life, challenges and success stories.</li><li><b>Politics:</b> Governance, law and civic rights — in a balanced way.</li><li><b>Economy:</b> Markets, farming, business and saving.</li><li><b>Culture & History:</b> The Gadaa system, festivals, language and history.</li><li><b>Education:</b> Opportunities and guidance for students and families.</li><li><b>Sports:</b> Athletics, football and our athletes' achievements.</li><li><b>World:</b> Global news that affects our lives.</li></ul>" },
      { h: "Why Barii News?", b: "<ul><li><b>Fast:</b> Opens quickly even on slow 2G/3G networks.</li><li><b>Every device:</b> Small and large phones, tablets and computers.</li><li><b>Many languages:</b> Afaan Oromoo, English, አማርኛ and 30+ world languages.</li><li><b>AI:</b> Automatic summaries, listen-to-article and smart search.</li><li><b>Clean reading:</b> When you open a story, you see only the story — nothing else.</li><li><b>Free:</b> Our information is free for everyone.</li></ul>" },
      { h: "Independence & Transparency", b: "<p>Barii News is not controlled by any political party, government body or company. All editorial decisions belong to our editor. If advertising or sponsorship ever appears, it will be clearly labelled “Advertisement” and will never influence our news content.</p>" },
      { h: "The Meaning of Our Logo", b: "<p>Our logo represents the people of Africa:</p><ul><li>⚫ <b>Black</b> — the African people, strength and self-reliance.</li><li>🔴 <b>Red</b> — commitment, love and the sacrifice of our ancestors.</li><li>⚪ <b>White</b> — peace, truth and purity.</li><li>☀️ <b>The rising sun</b> — dawn, hope and a new beginning.</li><li>👥 <b>Three people holding hands</b> — unity of family, community and generations.</li><li>〰️ <b>The traditional pattern</b> — African culture and heritage.</li></ul>" },
      { h: "Get Involved", b: "<p>Barii News belongs to the people. You can send us news tips, photos, ideas or opinion pieces. Everything you send is verified first, and your identity can stay confidential if you wish. Sharing our stories with friends also helps spread the truth.</p>" },
      { h: "Corrections & Complaints", b: "<p>We can make mistakes too. If you find an error in our reporting, tell us via “Contact Us”. Confirmed errors are corrected promptly, and the correction is stated openly.</p>" }
    ],
    policy: [
      "We verify every story with at least two reliable sources.",
      "We clearly separate news (facts) from opinion.",
      "We fairly present all sides of a disagreement.",
      "We never publish content that incites hatred based on ethnicity, religion or gender.",
      "We protect people's privacy — especially children and victims.",
      "We never use others' photos or writing without permission; we credit our sources.",
      "We protect the confidentiality of our sources.",
      "When we make mistakes, we correct them openly and promptly."
    ],
    close: "Barii News — With true information, a new dawn! 🌅"
  },
  am: {
    intro: [
      "<b>ባሪ ኒውስ (Barii News)</b> በግል የተመሰረተና የሚተዳደር ገለልተኛ የዲጂታል ዜናና መረጃ መድረክ ነው። ዋና ዓላማችን እውነተኛ፣ ሚዛናዊ፣ ጥራት ያለውና ወቅታዊ መረጃን በቀላል፣ በፈጣንና በነፃ ለህዝብ ማድረስ ነው።",
      "ዜና መዘገብ ብቻ ሳይሆን ግንዛቤ መፍጠር፣ ማህበረሰብን ማስተማርና የህዝብን ድምጽ ማሰማት እንፈልጋለን። ባሪ ኒውስ ማንኛውም ሰው — ከገጠር አርሶ አደር እስከ ዩኒቨርሲቲ ተማሪና የዓለም ምሁር — ታማኝ መረጃን በራሱ ቋንቋ የሚያገኝበት ቦታ ነው።"
    ],
    sections: [
      { h: "ታሪካችን", b: "<p>ባሪ ኒውስ በ2026 በግል ተነሳሽነት ተመሰረተ። የተነሳው ከቀላል ግን ትልቅ ችግር ነው፤ ህዝባችን በራሱ ቋንቋ የተዘጋጀ ታማኝና ሚዛናዊ መረጃ ለማግኘት መቸገሩ።</p><p>ማህበራዊ ሚዲያ ዜናን በፍጥነት ያሰራጫል፤ ነገር ግን እውነትን ከሐሰት መለየት ብዙ ጊዜ ከባድ ነው። ባሪ ኒውስ በሙያዊ የጋዜጠኝነት እሴቶች ላይ ተመስርቶ የተረጋገጡ ዜናዎችን ብቻ ለማቅረብ ተፈጠረ። ከትንሽ ጀምረን ከአንባቢዎቻችን ጋር አብረን እያደግን ነው።</p>" },
      { h: "የ«ባሪ» ትርጉም", b: "<p>በኦሮምኛ <b>«ባሪ»</b> ማለት <i>ንጋት</i> ነው — የሌሊቱ ጨለማ አልፎ የቀኑ ብርሃን የሚታይበት ጊዜ። ንጋት የተስፋ፣ የአዲስ ጅማሬና የአዲስ ዕድል ምልክት ነው።</p><p>ንጋት ጨለማን እንደሚያባርር ሁሉ፣ እኛም የመረጃ እጦትን፣ አለማወቅንና የሐሰት ዜናን ጨለማ በእውቀትና በእውነት ብርሃን ለመተካት እንፈልጋለን።</p>" },
      { h: "ተልዕኮአችን", b: "<p>እውነተኛ፣ ጥራት ያለውና ጠቃሚ መረጃን በብዙ ቋንቋዎች — በተለይም በአፋን ኦሮሞ — በማቅረብ መብቱን የሚያውቅና ጥሩ ውሳኔ የሚሰጥ በእውቀት የነቃ ማህበረሰብ መገንባት።</p>" },
      { h: "ራዕያችን", b: "<p>በአፍሪካ እጅግ ታማኝና በብዛት የሚነበብ የዲጂታል ዜና ምንጭ በመሆን የአፍሪካ ህዝቦችን ድምጽ ለዓለም ማሰማት።</p>" },
      { h: "ግቦቻችን", b: "<ul><li>እውነተኛና የተረጋገጠ መረጃ ለህዝብ ማቅረብ።</li><li>የሐሰት ዜናንና የተሳሳተ መረጃን መከላከል።</li><li>አፋን ኦሮሞንና ሌሎች የአፍሪካ ቋንቋዎችን በዲጂታል ዓለም ማሳደግ።</li><li>በጤና፣ በትምህርት፣ በሳይንስና በቴክኖሎጂ ግንዛቤ መፍጠር።</li><li>የማህበረሰብን በተለይም የገጠር ነዋሪዎችን፣ የሴቶችንና የወጣቶችን ድምጽ ማሰማት።</li><li>የአፍሪካን ባህል፣ ታሪክና እሴት በኩራት ለቀጣዩ ትውልድ ማስተላለፍ።</li></ul>" },
      { h: "እሴቶቻችን", b: "<ul><li><b>እውነት፡</b> የተረጋገጠውን ብቻ እንዘግባለን።</li><li><b>ፍትሃዊነትና ሚዛናዊነት፡</b> የሁሉንም ወገን ሀሳብ በፍትሃዊነት እናቀርባለን።</li><li><b>ነፃነት፡</b> ከየትኛውም የፖለቲካ፣ የኢኮኖሚ ወይም የግል ኃይል ትዕዛዝ አንቀበልም።</li><li><b>ሰብአዊ ክብር፡</b> የሁሉንም ሰው መብት፣ ክብርና ግላዊነት እናከብራለን።</li><li><b>ተጠያቂነት፡</b> ለስህተታችን ኃላፊነት ወስደን በግልጽ እናርማለን።</li><li><b>የህዝብ ድምጽ፡</b> ድምጻቸው ለማይሰማ መድረክ እንሰጣለን።</li><li><b>የአፍሪካ ኩራት፡</b> የአፍሪካን እውቀት፣ ባህልና ታሪክ በኩራት እናቀርባለን።</li></ul>" },
      { h: "ምን እንዘግባለን?", b: "<ul><li><b>ጤና፡</b> የጤና ምክር፣ በሽታ መከላከል፣ አመጋገብና ንፅህና።</li><li><b>ሳይንስና ቴክኖሎጂ፡</b> ፈጠራ፣ ኢንተርኔት፣ AI እና ህይወትን የሚቀይር ቴክኖሎጂ።</li><li><b>ማህበረሰብ፡</b> የማህበረሰብ ህይወት፣ ችግሮችና ስኬቶች።</li><li><b>ፖለቲካ፡</b> አስተዳደር፣ ህግና የዜግነት መብት — በሚዛናዊነት።</li><li><b>ኢኮኖሚ፡</b> ገበያ፣ ግብርና፣ ንግድና ቁጠባ።</li><li><b>ባህልና ታሪክ፡</b> የገዳ ሥርዓት፣ በዓላት፣ ቋንቋና ታሪክ።</li><li><b>ትምህርት፡</b> ለተማሪዎችና ለቤተሰቦች ዕድሎችና መመሪያዎች።</li><li><b>ስፖርት፡</b> አትሌቲክስ፣ እግር ኳስና የአትሌቶቻችን ስኬት።</li><li><b>ዓለም፡</b> ህይወታችንን የሚነኩ የዓለም ዜናዎች።</li></ul>" },
      { h: "ለምን ባሪ ኒውስ?", b: "<ul><li><b>ፈጣን፡</b> በደካማ 2G/3G ኔትወርክም በፍጥነት ይከፈታል።</li><li><b>በሁሉም መሳሪያ፡</b> በትንሽና በትልቅ ስልክ፣ በታብሌትና በኮምፒውተር።</li><li><b>ብዙ ቋንቋዎች፡</b> Afaan Oromoo፣ English፣ አማርኛ እና ከ30 በላይ የዓለም ቋንቋዎች።</li><li><b>AI፡</b> ራስ-ሰር ማጠቃለያ፣ ዜናን በድምጽ ማዳመጥና ብልህ ፍለጋ።</li><li><b>ንፁህ ንባብ፡</b> ዜና ሲከፈት ዜናው ብቻ ይታያል።</li><li><b>ነፃ፡</b> መረጃችን ለሁሉም በነፃ ነው።</li></ul>" },
      { h: "ነፃነትና ግልጽነት", b: "<p>ባሪ ኒውስ በየትኛውም የፖለቲካ ፓርቲ፣ የመንግስት ተቋም ወይም ድርጅት ቁጥጥር ስር አይደለም። የአርትዖት ውሳኔዎች ሙሉ በሙሉ የአርታኢያችን ናቸው። ወደፊት ማስታወቂያ ወይም ድጋፍ ቢኖር በግልጽ «ማስታወቂያ» ተብሎ ይለያል፤ በዜና ይዘታችንም ላይ ተጽዕኖ አይኖረውም።</p>" },
      { h: "የአርማችን ትርጉም", b: "<p>አርማችን የአፍሪካ ህዝቦችን ይወክላል፡</p><ul><li>⚫ <b>ጥቁር</b> — የአፍሪካ ህዝቦች፣ ጥንካሬና ራስን መቻል።</li><li>🔴 <b>ቀይ</b> — ቁርጠኝነት፣ ፍቅርና የአባቶቻችን መስዋዕትነት።</li><li>⚪ <b>ነጭ</b> — ሰላም፣ እውነትና ንፅህና።</li><li>☀️ <b>የምትወጣዋ ፀሐይ</b> — ንጋት፣ ተስፋና አዲስ ጅማሬ።</li><li>👥 <b>እጅ ለእጅ የተያያዙ ሦስት ሰዎች</b> — የቤተሰብ፣ የማህበረሰብና የትውልድ አንድነት።</li><li>〰️ <b>ባህላዊ ጌጡ</b> — የአፍሪካ ባህልና ቅርስ።</li></ul>" },

function videoInfo(u = "") {

  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { kind: "frame", src: "https://player.vimeo.com/video/" + m[1] + "?autoplay=1", thumb: "", tall: false };
  m = u.match(/tiktok\.com\/.*\/video\/(\d+)/);

  if (/facebook\.com\/|fb\.watch\//.test(u)) return { kind: "frame", src: "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(u) + "&show_text=false&autoplay=true", thumb: "", tall: false };
  if (/^data:video|\.(mp4|webm|ogg|ogv|mov|m4v)(\?|#|$)/i.test(u)) return { kind: "file", src: u, thumb: "", tall: false };
  return { kind: "link", src: u, thumb: "", tall: false };

      const st = t.length > 4 ? t.slice(0, t.length - 2) : t;
      s += ti.indexOf(t) > -1 ? 6 : ti.indexOf(st) > -1 ? 3 : 0;
      s += su.indexOf(t) > -1 ? 3 : su.indexOf(st) > -1 ? 1.5 : 0;
      s += bo.indexOf(t) > -1 ? 1 : bo.indexOf(st) > -1 ? 0.5 : 0;
      s += ca.indexOf(t) > -1 ? 4 : 0;
    });
    return { a: a, s: s };
  }).filter(function (x) { return x.s > 0; })
    .sort(function (x, y) { return y.s - x.s; })
    .map(function (x) { return x.a; });
}

/* ---- AI: Cuunfaa ofumaan (meeshaa kee irratti, interneetii malee) ---- */
const STOP = ["fi", "kan", "ni", "kana", "sana", "irratti", "keessatti", "akka", "yoo", "isaan", "inni", "ishee", "isa", "ykn", "garuu", "immoo", "ammoo",
  "the", "and", "of", "to", "in", "is", "for", "that", "on", "with", "are", "this", "be", "as", "by", "it", "from"];
let LETTERS = /[a-z']+/g;
try { LETTERS = new RegExp("[\\p{L}']+", "gu"); } catch (_e) { /* browser moofaa */ }

function words(s = "") {
  return (s.toLowerCase().match(LETTERS) || [""]).filter(function (w) { return w.length > 2 && STOP.indexOf(w) < 0; });
}
function summarize(text = "", n = 3) {
  const sents = (text.replace(/\s+/g, " ").match(/[^.!?።]+[.!?።]?/g) || [""])
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.split(" ").length >= 5; });
  if (sents.length <= n) return sents;
  const f = new Map([["", 0]]);
  sents.forEach(function (s) { words(s).forEach(function (w) { f.set(w, (f.get(w) || 0) + 1); }); });
  return sents.map(function (s, i) {
    const ws = words(s);
    let sc = ws.reduce(function (sum, w) { return sum + (f.get(w) || 0); }, 0) / Math.pow(ws.length || 1, 0.55);
    if (i === 0) sc *= 1.35;
    return { s: s, i: i, sc: sc };
  }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, n)
    .sort(function (a, b) { return a.i - b.i; })
    .map(function (x) { return x.s; });
}

  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
